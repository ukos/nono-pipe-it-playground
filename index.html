<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PIPE IT! — Script More, Work Less</title>
<meta name="description" content="PIPE IT! — PowerShellで運用作業をこなし、スクリプトで自動化していくゲーム。">
<link rel="icon" type="image/png" sizes="32x32" href="assets/appicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/appicon-180.png">
<style>
  :root{
    --bg:#04150e; --panel:rgba(8,38,24,.92); --panel2:#0a2e1c;
    --line:#2c7a4b; --ink:#f2f7e8; --sub:#a8c8a0;
    --yellow:#ffe81a; --lime:#b6e62e; --green:#37c978; --red:#ff7a6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#020a06;overflow-x:hidden;overflow-x:clip}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);overscroll-behavior:none}
  .wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    background-size:cover;background-position:top center;background-repeat:no-repeat}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  /* title */
  #screen-title{text-align:center;padding-top:8dvh}
  #screen-title img.logo{width:min(88%,360px);height:auto;display:block;margin:0 auto}
  .bigbtn{display:block;width:100%;margin:14px 0 0;padding:16px 14px;font-size:17px;font-weight:800;
    text-align:left;color:#081c10;background:linear-gradient(180deg,var(--yellow),var(--lime));
    border:0;border-radius:12px;cursor:pointer}
  .bigbtn:active{filter:brightness(1.1)}
  #btn-start{text-align:center}
  #btn-run, #btn-reset{text-align:center}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .btnrow .bigbtn, .btnrow .ghostbtn{flex:1 1 0;margin:0}
  .ghostbtn{display:block;width:100%;margin:10px 0 0;padding:14px;font-size:15px;font-weight:700;
    text-align:left;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer}
  .ghostbtn:disabled{opacity:.45;cursor:default}
  .note{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:18px}
  /* headers */
  .bar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .back{flex:0 0 auto;background:var(--panel);color:var(--ink);border:2px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
  .bar h2{margin:0;font-size:17px;line-height:1.3}
  .bar .sub{font-size:12px;color:var(--sub)}
  /* theme / stage lists */
  .tbtn{display:flex;width:100%;align-items:center;gap:12px;margin:10px 0;padding:12px 14px;
    background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left}
  .tbtn:disabled{opacity:.5;cursor:default}
  .tbtn img{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
  .tbtn .tt{flex:1 1 auto;min-width:0}
  .tbtn .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn .tt span{font-size:12px;color:var(--sub)}
  .badge{flex:0 0 auto;font-size:11px;font-weight:800;color:#081c10;background:var(--lime);
    border-radius:999px;padding:4px 10px;white-space:nowrap}
  .badge.dim{background:#37503f;color:var(--sub)}
  .dots{font-size:12px;color:var(--yellow);letter-spacing:2px;white-space:nowrap}
  /* game */
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
  .panel h3{margin:0 0 6px;font-size:13px;color:var(--lime);letter-spacing:.08em}
  .panel p{margin:0;font-size:14px;line-height:1.75}
  .env{font-size:12.5px;line-height:1.5}
  .env .folder{margin:8px 0 2px;font-weight:800;color:var(--yellow);font-size:13px}
  .env table{width:100%;border-collapse:collapse}
  .env td{padding:3px 4px;border-bottom:1px solid rgba(60,140,90,.35);vertical-align:middle}
  .env td.n{word-break:break-all}
  .env td.r{text-align:right;white-space:nowrap;color:var(--sub)}
  .env img{width:22px;height:22px;object-fit:contain;vertical-align:middle}
  .env .empty{color:var(--sub);padding:2px 4px}
  .env .loglines{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;padding:2px 4px;word-break:break-all}
  textarea{width:100%;min-height:76px;background:#03130b;color:#eaffea;border:2px solid var(--line);
    border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.6;resize:vertical}
  .kbd{margin:8px 0 0;display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .kbd .krow{display:flex;gap:5px}
  .kbd .key{flex:1 1 0;min-width:0;height:46px;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);
    border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;cursor:pointer;padding:0}
  .kbd .key:active{background:var(--line)}
  .kbd .key.wide{flex:2.2 1 0}
  .kbd .key.space{flex:4 1 0}
  .kbd .key.on{background:var(--yellow);color:#1a2b12;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .chip{background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
  .chip:active{background:var(--line)}
  .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
  .out .dim{color:var(--sub)}
  .feedback{font-size:14.5px;line-height:1.7}
  .feedback.ok{color:var(--lime);font-weight:700}
  .feedback.ng{color:var(--red)}
  .autobar{height:12px;background:#0a2e1c;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .autobar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime))}
  .autotext{font-size:13px;color:var(--sub)}
  .autotext b{color:var(--yellow);font-size:15px}
  .hidden{display:none}
  footer{margin-top:22px;text-align:center;color:var(--sub);font-size:11px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <!-- title -->
  <section id="screen-title">
    <h1 class="sr">PIPE IT! — Script More, Work Less</h1>
    <img class="logo" src="assets/logo.jpg" alt="PIPE IT! — Script More, Work Less">
    <button class="bigbtn" id="btn-start">▶ はじめる</button>
    <div class="panel" style="text-align:left"><h3>自動化の進み具合</h3><div class="autobar"><i id="auto-fill" style="width:0%"></i></div><div class="autotext" id="auto-text"></div></div>
    <p class="note">PowerShell のコマンドで日々の運用作業をこなすゲームです。（バージョン 0.14）最初は手打ち、覚えたらスクリプト化、そして自動化へ。<br>Microsoft、Windows、PowerShell は Microsoft グループの商標です。本アプリは非公式の学習ゲームで、Microsoft とは関係ありません。</p>
  </section>

  <!-- themes -->
  <section id="screen-themes" class="hidden">
    <div class="bar"><h2>業務テーマを選ぶ</h2></div>
    <div class="autotext" id="theme-auto" style="margin:-4px 0 6px"></div>
    <div id="theme-list"></div>
    <footer>クリアした段階は端末に保存されます</footer>
  </section>

  <!-- stages -->
  <section id="screen-stages" class="hidden">
    <div class="bar"><button class="back" data-back="themes">← テーマ</button><div><h2 id="stage-theme-name"></h2><div class="sub">段階を選ぶ</div></div></div>
    <div id="stage-list"></div>
  </section>

  <!-- game -->
  <section id="screen-game" class="hidden">
    <div class="bar"><button class="back" data-back="stages">← 段階</button><div style="flex:1 1 auto"><h2 id="game-title"></h2><div class="sub" id="game-sub"></div></div></div>
    <div class="panel"><h3>依頼</h3><p id="quest-request"></p></div>
    <div class="panel"><h3>いまの環境</h3><div class="env" id="quest-env"></div></div>
    <div class="panel" id="script-panel"><h3>コマンド</h3>
      <textarea id="cmd-input" readonly inputmode="none" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off" lang="en" placeholder="下のキーボードとチップで入力"></textarea>
      <div class="kbd" id="kbd"></div>
      <div class="chips" id="chips"></div>
      <div class="btnrow">
        <button class="bigbtn" id="btn-run">実行する</button>
        <button class="ghostbtn" id="btn-reset">やり直す</button>
      </div>
      <button class="bigbtn hidden" id="btn-advance" style="background:linear-gradient(180deg,#8be04e,#37c978)">▶▶ 1か月進める（自動実行）</button>
    </div>
    <div class="panel hidden" id="out-panel"><h3>出力</h3><div class="out" id="out-text"></div></div>
    <div class="panel hidden" id="feedback-panel"><div class="feedback" id="feedback-text"></div>
      <button class="bigbtn hidden" id="btn-next">▶ 次の段階へ</button>
      <button class="ghostbtn hidden" id="btn-fix4">段階4の関数を直す</button>
    </div>
  </section>

</div>
<script id="core">
'use strict';
/* ================= data ================= */
const FOLDERS = ['Downloads', 'Archive', 'Trash'];
/* base data: Length is written in KB here and converted to bytes (as in real
   PowerShell); LastWriteTime is written as "days ago" and converted to a
   date value (today = 0, n days ago = -n), so comparisons read like the real
   thing: $_.LastWriteTime -le (Get-Date).AddDays(-90) */
function baseFiles(){ return [
  {Name:'見積書_2025.xlsx',   Length:240,  LastWriteTime:12,  Extension:'.xlsx'},
  {Name:'会議メモ.txt',       Length:8,    LastWriteTime:3,   Extension:'.txt'},
  {Name:'setup_cache.tmp',    Length:1500, LastWriteTime:120, Extension:'.tmp'},
  {Name:'写真_旅行.jpg',      Length:3200, LastWriteTime:45,  Extension:'.jpg'},
  {Name:'temp_work.tmp',      Length:64,   LastWriteTime:200, Extension:'.tmp'},
  {Name:'報告書_第1四半期.docx', Length:380, LastWriteTime:210, Extension:'.docx'},
  {Name:'backup_old.zip',     Length:5200, LastWriteTime:400, Extension:'.zip'},
  {Name:'download_partial.tmp', Length:890, LastWriteTime:30, Extension:'.tmp'},
  {Name:'音楽サンプル.mp3',   Length:4100, LastWriteTime:15,  Extension:'.mp3'},
  {Name:'old_notes.txt',      Length:22,   LastWriteTime:190, Extension:'.txt'},
  {Name:'設計図_v2.pdf',      Length:760,  LastWriteTime:95,  Extension:'.pdf'},
  {Name:'cache2.tmp',         Length:45,   LastWriteTime:95,  Extension:'.tmp'},
  {Name:'old_cache.tmp',      Length:30,   LastWriteTime:90,  Extension:'.tmp'},
  {Name:'recent_work.tmp',    Length:28,   LastWriteTime:89,  Extension:'.tmp'},
  {Name:'集計データ.csv',     Length:100,  LastWriteTime:50,  Extension:'.csv'},
  {Name:'手順書_改訂.pdf',    Length:150,  LastWriteTime:20,  Extension:'.pdf'}
];}
function toFile(f){
  return { Name:f.Name, Length: Math.round(f.Length * 1024), LastWriteTime:{ __date:-f.LastWriteTime }, Extension:f.Extension, Folder:'Downloads' };
}
function makeEnv(){
  const env = {Downloads:[], Archive:[], Trash:[]};
  for (const f of baseFiles()) env.Downloads.push(toFile(f));
  env.Downloads.sort((a, b) => a.Name.localeCompare(b.Name, 'ja'));
  return env;
}
function fmtDate(dv){
  const base = new Date(); base.setDate(base.getDate() + dv.__date);
  return base.getFullYear() + '/' + (base.getMonth() + 1) + '/' + base.getDate();
}
/* ---- theme: log ----
   Log lines are plain TEXT lines (like real Get-Content output):
   "HH:MM LEVEL SOURCE message". Searching is done with -like patterns. */
function baseLines(){ return [
  '08:58 INFO Web サーバー起動',
  '09:01 INFO 決済 決済サービス接続OK',
  '09:03 WARN DB 接続プール使用率80%',
  '09:05 ERROR アプリ timeout: 注文API応答なし',
  '09:12 ERROR 決済 timeout: 決済ゲートウェイ応答なし',
  '09:18 WARN アプリ メモリ使用率85%',
  '09:21 ERROR アプリ timeout: 在庫API応答なし',
  '09:30 ERROR DB 接続エラー: 接続が拒否されました',
  '09:40 ERROR 決済 カード検証エラー',
  '09:52 INFO DB バックアップ完了',
  '10:02 INFO Web 定期ヘルスチェックOK',
  '10:06 ERROR 決済 timeout: 決済ゲートウェイ応答なし',
  '10:11 WARN 決済 決済キューの滞留',
  '10:15 ERROR 決済 二重請求の検知',
  '10:23 ERROR アプリ timeout: 配送API応答なし',
  '10:29 ERROR アプリ 決済 API応答なし',
  '10:31 INFO 決済 決済完了 98件',
  '10:36 ERROR 決済 残高照会エラー',
  '10:40 ERROR Web 502エラー多発',
  '10:47 WARN DB レプリケーション遅延',
  '11:03 INFO アプリ 定期ジョブ完了',
  '11:15 ERROR 決済 決済ゲートウェイ接続断',
  '11:32 WARN Web 応答時間の悪化'
];}
function makeLogEnv(){
  return { Log: baseLines(), Alerts: [] };
}
/* ---- theme: disk ---- */
const GB = 1024 * 1024 * 1024;
function baseDrives(){ return [
  {Name:'C', Used:180, Free:35},
  {Name:'D', Used:700, Free:300},
  {Name:'E', Used:95,  Free:5},
  {Name:'F', Used:450, Free:8},
  {Name:'G', Used:120, Free:12},
  {Name:'H', Used:980, Free:20}
];}
const EXTRA_DRIVES = [
  {Name:'Alias', Provider:'Alias', Used:null, Free:null},
  {Name:'Cert', Provider:'Certificate', Used:null, Free:null},
  {Name:'Env', Provider:'Environment', Used:null, Free:null},
  {Name:'HKLM', Provider:'Registry', Used:null, Free:null}
];
function makeDiskEnv(){
  return { Drives: baseDrives().map(d => ({ Name:d.Name, Used:d.Used * GB, Free:d.Free * GB })), PSDrivesExtra: EXTRA_DRIVES.map(d => ({ ...d })), Report: [] };
}
/* ---- theme: process ---- */
const MB = 1024 * 1024;
function baseProcesses(){ return [
  {Name:'backup-agent',   Id:3100, WS:640,  CPU:120.0},
  {Name:'chrome',         Id:2400, WS:1200, CPU:820.3},
  {Name:'explorer',       Id:4100, WS:150,  CPU:60.5},
  {Name:'notepad',        Id:4800, WS:25,   CPU:1.2},
  {Name:'powershell',     Id:4600, WS:90,   CPU:12.4},
  {Name:'sqlservr',       Id:1200, WS:2400, CPU:1500.5},
  {Name:'svchost',        Id:900,  WS:180,  CPU:45.0},
  {Name:'Teams',          Id:3300, WS:580,  CPU:300.2}
];}
function baseServices(){ return [
  {Name:'BackupService', Status:'Stopped', StartType:'Automatic'},
  {Name:'MonitorAgent',  Status:'Stopped', StartType:'Automatic'},
  {Name:'Spooler',       Status:'Running', StartType:'Automatic'},
  {Name:'UpdateService', Status:'Stopped', StartType:'Disabled'},
  {Name:'W32Time',       Status:'Stopped', StartType:'Manual'},
  {Name:'WinRM',         Status:'Running', StartType:'Manual'}
];}
function toProcess(d){ return { Name:d.Name, Id:d.Id, WS:d.WS * MB, CPU:d.CPU }; }
function makeProcessEnv(){
  return { Processes: baseProcesses().map(toProcess), Services: baseServices().map(s => ({...s})) };
}
/* ---- theme: users ---- */
const SID_PREFIX = 'S-1-5-21-3623811015-3361044348-30300820-';
function baseUsers(){ return [
  {Name:'Administrator', Enabled:true,  LastLogonDays:300, Description:'緊急用の管理者', SID:SID_PREFIX + '500'},
  {Name:'backup-admin',  Enabled:true,  LastLogonDays:30,  Description:'管理者（予備）', SID:SID_PREFIX + '1000'},
  {Name:'guest-trainee', Enabled:true,  LastLogonDays:250, Description:'研修用ゲスト', SID:SID_PREFIX + '1001'},
  {Name:'hanako.qa',     Enabled:false, LastLogonDays:500, Description:'QA用', SID:SID_PREFIX + '1002'},
  {Name:'ito',           Enabled:true,  LastLogonDays:160, Description:'開発部', SID:SID_PREFIX + '1003'},
  {Name:'kobayashi',     Enabled:true,  LastLogonDays:120, Description:'総務部', SID:SID_PREFIX + '1004'},
  {Name:'sato',          Enabled:true,  LastLogonDays:200, Description:'営業部', SID:SID_PREFIX + '1005'},
  {Name:'shinjin',       Enabled:true,  LastLogonDays:null, Description:'来週入社予定', SID:SID_PREFIX + '1006'},
  {Name:'suzuki',        Enabled:true,  LastLogonDays:5,   Description:'開発部', SID:SID_PREFIX + '1007'},
  {Name:'tanaka',        Enabled:true,  LastLogonDays:2,   Description:'営業部', SID:SID_PREFIX + '1008'},
  {Name:'yamada',        Enabled:true,  LastLogonDays:400, Description:'営業部（退職済み）', SID:SID_PREFIX + '1009'}
];}
function toUser(d){ return { Name:d.Name, Enabled:d.Enabled, Description:d.Description || '', SID:d.SID || '', LastLogon: d.LastLogonDays == null ? null : { __date: -d.LastLogonDays } }; }
function makeUsersEnv(){
  return { Users: baseUsers().map(toUser) };
}
/* ---- theme: backup ---- */
function baseBackupSet(){ return [
  {Name:'売上集計.xlsx', Folder:'Data', Length:300, LastWriteTime:2},
  {Name:'顧客リスト.csv', Folder:'Data', Length:150, LastWriteTime:1},
  {Name:'議事録.docx', Folder:'Data', Length:80, LastWriteTime:3},
  {Name:'見積書.docx', Folder:'Data', Length:60, LastWriteTime:6},
  {Name:'在庫表.xlsx', Folder:'Data', Length:120, LastWriteTime:0},
  {Name:'写真_現場.jpg', Folder:'Data', Length:3000, LastWriteTime:10},
  {Name:'メモ.txt', Folder:'Data', Length:5, LastWriteTime:15},
  {Name:'設計書.pdf', Folder:'Data', Length:2000, LastWriteTime:40},
  {Name:'売上集計.xlsx', Folder:'Backup', Length:280, LastWriteTime:8},
  {Name:'顧客リスト.csv', Folder:'Backup', Length:140, LastWriteTime:8},
  {Name:'議事録.docx', Folder:'Backup', Length:75, LastWriteTime:9},
  {Name:'設計書.pdf', Folder:'Backup', Length:2000, LastWriteTime:40}
];}
function toBackupFile(f){
  return { Name:f.Name, Length: Math.round(f.Length * 1024), LastWriteTime:{ __date:-f.LastWriteTime }, Extension: f.Extension || f.Name.slice(f.Name.lastIndexOf('.')), Folder:f.Folder };
}
function makeBackupEnv(){
  const env = { Data: [], Backup: [] };
  for (const raw of baseBackupSet()) env[raw.Folder].push(toBackupFile(raw));
  return env;
}
/* ---- theme: network ---- */
function baseHosts(){ return [
  {Name:'vpn-gateway', IPAddress:'192.168.1.1',  Reachable:true,  Latency:1,  Ports:{}},
  {Name:'web-server',  IPAddress:'192.168.1.10', Reachable:true,  Latency:1, Ports:{80:true, 443:true}},
  {Name:'db-server',   IPAddress:'192.168.1.20', Reachable:true,  Latency:2, Ports:{1433:true}},
  {Name:'file-server', IPAddress:'192.168.1.30', Reachable:false, Latency:null, DownStatus:'DestinationHostUnreachable', Ports:{}},
  {Name:'mail-server', IPAddress:'192.168.1.40', Reachable:true,  Latency:30, Ports:{587:true}},
  {Name:'printer',     IPAddress:'192.168.1.50', Reachable:true,  Latency:0,  Ports:{9100:true}}
];}
function makeNetworkEnv(){
  return { targets: baseHosts().map(h => h.Name), Hosts: baseHosts().map(h => ({ ...h, Ports: { ...h.Ports } })) };
}
/* ---- theme: software ---- */
function basePackages(){ return [
  {DisplayName:'Adobe Acrobat Reader DC', DisplayVersion:'24.0.0', Publisher:'Adobe Inc.', InstallDays:30},
  {DisplayName:'Adobe Flash Player 32', DisplayVersion:'32.0.0', Publisher:'Adobe Systems Incorporated', InstallDays:1500},
  {DisplayName:'Google Chrome', DisplayVersion:'150.0.7871.100', Publisher:'Google LLC', InstallDays:10},
  {DisplayName:'Java 8 Update 202', DisplayVersion:'8.0.2020.8', Publisher:'Oracle Corporation', InstallDays:1200},
  {DisplayName:'Microsoft Office 2021', DisplayVersion:'16.0.14334', Publisher:'Microsoft Corporation', InstallDays:200},
  {DisplayName:'Slack', DisplayVersion:'4.38.0', Publisher:'Slack Technologies, Inc.', InstallDays:60},
  {DisplayName:'WinZip 20', DisplayVersion:'20.0.0', Publisher:'Corel Corporation', InstallDays:900},
  {DisplayName:'Zoom', DisplayVersion:'6.0.0', Publisher:'Zoom Video Communications, Inc.', InstallDays:null},
  {DisplayName:'iTunes', DisplayVersion:'12.12.0', Publisher:'Apple Inc.', InstallDays:710},
  {DisplayName:'ウイルスバスター クラウド', DisplayVersion:'17.0.0', Publisher:'Trend Micro Inc.', InstallDays:100}
];}
function toPackage(p){
  return { DisplayName:p.DisplayName, DisplayVersion:p.DisplayVersion, Publisher:p.Publisher, InstallDate: p.InstallDays == null ? '' : fmtYMD(-p.InstallDays), InstallDays: p.InstallDays };
}
function makeSoftwareEnv(){
  return { Packages: basePackages().map(toPackage) };
}
/* ---- theme: events ---- */
function baseEvents(){ return [
  {d:0, Time:'09:12', Id:7034, Level:2, ProviderName:'Service Control Manager', Message:'Print Spooler サービスは予期せぬ原因により終了しました。このサービスの終了は 3 回目です。'},
  {d:0, Time:'08:45', Id:1014, Level:3, ProviderName:'DNS Client', Message:'名前 resolver.local の名前解決がタイムアウトしました'},

function toEvent(e){
  const days = e.TimeCreatedDays !== undefined ? e.TimeCreatedDays : e.d;
  return { TimeCreated:{ __date:-days }, Time:e.Time, Id:e.Id, Level:e.Level, LevelDisplayName: LEVEL_NAMES[e.Level] || '', ProviderName:e.ProviderName, Message:e.Message };
}
function makeEventsEnv(){
  return { Events: baseEvents().map(toEvent) };
}

}

function tokenize(src){
  const toks = []; let i = 0;
  while (i < src.length){
    const c = src[i];
    if (c === ' ' || c === '\t' || c === '\r'){ i++; continue; }
    if (c === '\n' || c === ';'){ toks.push({t:'sep'}); i++; continue; }
    if (c === '|'){ toks.push({t:'pipe'}); i++; continue; }
    if (c === '@'){ toks.push({t:'@'}); i++; continue; }
    if (c === '/'){ toks.push({t:'/'}); i++; continue; }
    if (c === '='){ toks.push({t:'='}); i++; continue; }
    if (c === '{' || c === '}' || c === '(' || c === ')' || c === ','){ toks.push({t:c}); i++; continue; }
    if (c === '.' && !/[0-9]/.test(src[i+1] || '')){ toks.push({t:'.'}); i++; continue; }
    if (c === "'" || c === '"'){ let j = i + 1, s = ''; while (j < src.length && src[j] !== c){ s += src[j]; j++; }
      if (j >= src.length) throw new Error('文字列が閉じていません'); toks.push({t:'str', v:s, dq: c === '"'}); i = j + 1; continue; }
    if (c === '$'){ let j = i + 1, nm = ''; while (j < src.length && /[A-Za-z0-9_]/.test(src[j])){ nm += src[j]; j++; }
      toks.push({t:'var', v:nm}); i = j; continue; }
    if (c === '-' && src[i+1] === '$'){ toks.push({t:'neg'}); i++; continue; }
    if (c === '-' && /[A-Za-z]/.test(src[i+1] || '')){ let j = i + 1, nm = '-'; while (j < src.length && /[A-Za-z]/.test(src[j])){ nm += src[j]; j++; }
      toks.push({t:'param', v:nm.toLowerCase()}); i = j; continue; }
    if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i+1] || '')) || (c === '-' && /[0-9]/.test(src[i+1] || ''))){
      let j = i, num = ''; if (src[j] === '-'){ num = '-'; j++; }
      while (j < src.length && /[0-9.]/.test(src[j])){ num += src[j]; j++; }
      let v = parseFloat(num);
      const suf = src.slice(j, j + 2);
      if (/^(KB|MB|GB)$/i.test(suf)){ const m = {KB:1024, MB:1024 * 1024, GB:1024 * 1024 * 1024}[suf.toUpperCase()]; v *= m; j += 2; }
      toks.push({t:'num', v}); i = j; continue; }
    if (c === '*'){ let j = i, w = ''; while (j < src.length && /[A-Za-z0-9_.*\\-]/.test(src[j])){ w += src[j]; j++; }
      toks.push({t:'str', v:w}); i = j; continue; }
    if (c === '?'){ toks.push({t:'word', v:'?'}); i++; continue; }
    if (c === '['){ let j = i + 1; while (j < src.length && src[j] !== ']') j++; toks.push({t:'type'}); i = j + 1; continue; }
    if (/[A-Za-z_]/.test(c) || c.charCodeAt(0) > 127){ let j = i, w = ''; while (j < src.length && (/[A-Za-z0-9_-]/.test(src[j]) || src[j].charCodeAt(0) > 127 || (src[j] === '.' && /[A-Za-z0-9]/.test(src[j + 1] || '')))){ w += src[j]; j++; }
      if (src[j] === ':'){ while (j < src.length && /[A-Za-z0-9_.*\\:\/-]/.test(src[j])){ w += src[j]; j++; } toks.push({t:'str', v:w}); i = j; continue; }
      if (src[j] === '\\'){ while (j < src.length && /[A-Za-z0-9_.*\\-]/.test(src[j])){ w += src[j]; j++; } toks.push({t:'str', v:w}); i = j; continue; }
      toks.push({t:'word', v:w}); i = j; continue; }
    throw new Error('読み取れない文字があります: ' + c);
  }
  return toks;

  done(){ return this.i >= this.toks.length; }

    `<tr><td class="n">${p.Name}</td><td class="r">ID ${p.Id}</td><td class="r">メモリ ${fmtMB(p.WS)}</td></tr>`).join('') + '</table>';
  h += '<div class="folder">🧩 サービス</div><table>' + env.Services.map(s =>
    `<tr><td class="n">${s.Name}</td><td class="r">${s.StartType}</td><td class="r">${s.Status === 'Running' ? '🟢 Running' : '🔴 Stopped'}</td></tr>`).join('') + '</table>';
  return h;
}
function usersHtml(env){
  return '<div class="folder">👤 ローカルユーザー</div><table>' + env.Users.map(u =>
    `<tr><td class="n">${u.Name}</td><td class="r">${u.Enabled ? '🟢 有効' : '🔴 無効'}</td><td class="r">${u.Description}</td></tr>`).join('') + '</table>';
}
function hostsHtml(env){
  let h = '<div class="folder">📋 targets.txt（監視対象リスト）</div><table>' + env.targets.map(t =>
    `<tr><td class="n">${t}</td></tr>`).join('') + '</table>';
  h += '<div class="folder">🖥️ サーバー一覧</div><table>' + env.Hosts.map(x =>
    `<tr><td class="n">${x.Name}</td><td class="r">${x.IPAddress}</td></tr>`).join('') + '</table>';
  return h;
}
function packagesHtml(env){
  return '<div class="folder">📦 インストール済みソフト（レジストリのアンインストール情報）</div><table>' + env.Packages.map(p =>
    `<tr><td class="n">${p.DisplayName}</td><td class="r">${p.DisplayVersion}</td><td class="r">${p.Publisher}</td></tr>`).join('') + '</table>';
}
function eventsHtml(env){
  return '<div class="folder">⚠️ イベントログ（System）</div><table>' + env.Events.map(e =>
    `<tr><td class="n">${fmtDate(e.TimeCreated)} ${e.Time}</td><td class="r">${e.LevelDisplayName}</td><td class="r">ID:${e.Id}</td><td class="r">${e.Message}</td></tr>`).join('') + '</table>';
}
function openQuest(q){
  currentQuest = q;
  setBg(currentTheme.bg);
  $('game-title').textContent = `段階${q.stage}： ${q.title}`;
  $('game-sub').textContent = `${currentTheme.name} ／ ${STAGE_NAMES[q.stage - 1]}`;
  let req = q.request;
  if (q.stage === 5 && save.scripts[q.theme]){
    const fn4 = QUESTS.find(x => x.theme === q.theme && x.stage === 4);
    req += '<br><span style="color:var(--sub);font-size:12.5px">保存済みスクリプト： 段階4で作った ' + (fn4 ? fn4.requireFunction : '') + ' が読み込まれています。</span>';
  }
  $('quest-request').innerHTML = req;
  $('quest-env').innerHTML = envHtml(themeMakeEnv(q.theme));
  const input = $('cmd-input'); input.value = (q.stage === 4 && save.scripts[q.theme]) ? save.scripts[q.theme] : '';
  if (q.sim) $('btn-advance').textContent = '▶▶ ' + q.sim.label;
  const chips = $('chips'); chips.innerHTML = '';
  for (const c of q.chips){
    const b = document.createElement('button'); b.className = 'chip'; b.textContent = c;
    b.addEventListener('click', () => { seTap(); insertAtCursor(c); });
    chips.appendChild(b);
  }
  $('out-panel').classList.add('hidden');
  $('feedback-panel').classList.add('hidden');
  $('btn-next').classList.add('hidden');
  $('btn-fix4').classList.add('hidden');
  $('btn-advance').classList.add('hidden');
  show('screen-game');
}
function insertAtCursor(text){
  const el = $('cmd-input');
  const s = el.selectionStart || el.value.length, e = el.selectionEnd || el.value.length;
  const before = el.value.slice(0, s), after = el.value.slice(e);
  const padL = (before && !/[\s{(|]$/.test(before)) ? ' ' : '';
  const padR = (after && !/^[\s})|]/.test(after)) ? ' ' : '';
  el.value = before + padL + text + padR + after;
  const pos = (before + padL + text + padR).length;
  el.focus(); el.setSelectionRange(pos, pos);
}
/* ---- in-app keyboard (user decision 2026-11-26: no OS keyboard) ---- */
const KBD = {
  abc: [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    [{t:'⇧', act:'shift', cls:'wide'}, 'z','x','c','v','b','n','m', {t:'⌫', act:'bs', cls:'wide'}],
    [{t:'#+=' , act:'page', cls:'wide'}, '-', {t:'', act:'space', cls:'space'}, {t:'改行', act:'enter', cls:'wide'}]
  ],
  sym: [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['|','$','_','{','}','(',')','-','=','*','@'],
    ["'",'"','.',',',':','/','%','\\','[',']','?',';'],
    [{t:'ABC', act:'page', cls:'wide'}, {t:'$_', ins:'$_'}, {t:'', act:'space', cls:'space'}, {t:'⌫', act:'bs'}, {t:'改行', act:'enter', cls:'wide'}]
  ]
};
let kbdPage = 'abc', kbdShift = false;
function renderKbd(){
  const box = $('kbd'); box.innerHTML = '';
  for (const row of KBD[kbdPage]){
    const r = document.createElement('div'); r.className = 'krow';
    for (const k of row){
      const key = typeof k === 'string' ? {t:k} : k;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'key' + (key.cls ? ' ' + key.cls : '');
      b.textContent = key.act === 'space' ? 'スペース' : (key.act === 'shift' && kbdShift ? '⇧ ON' : key.t);
      if (key.act === 'shift' && kbdShift) b.classList.add('on');
      b.dataset.act = key.act || ''; b.dataset.ins = key.ins || key.t;
      r.appendChild(b);
    }
    box.appendChild(r);
  }
}
function kbdRawInsert(text){
  const el = $('cmd-input');
  const s = el.selectionStart == null ? el.value.length : el.selectionStart;
  const e = el.selectionEnd == null ? s : el.selectionEnd;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  el.focus(); el.setSelectionRange(s + text.length, s + text.length);
}
function kbdBackspace(){
  const el = $('cmd-input');
  const s = el.selectionStart == null ? el.value.length : el.selectionStart;
  const e = el.selectionEnd == null ? s : el.selectionEnd;
  if (e > s){ el.value = el.value.slice(0, s) + el.value.slice(e); el.focus(); el.setSelectionRange(s, s); }
  else if (s > 0){ el.value = el.value.slice(0, s - 1) + el.value.slice(s); el.focus(); el.setSelectionRange(s - 1, s - 1); }
}
$('kbd').addEventListener('pointerdown', e => {
  const b = e.target.closest('.key'); if (!b) return;
  e.preventDefault();
  seTap();
  const act = b.dataset.act;
  if (act === 'shift'){ kbdShift = !kbdShift; renderKbd(); return; }
  if (act === 'page'){ kbdPage = kbdPage === 'abc' ? 'sym' : 'abc'; renderKbd(); return; }
  if (act === 'bs'){ kbdBackspace(); return; }
  if (act === 'enter'){ kbdRawInsert('\n'); return; }
  if (act === 'space'){ kbdRawInsert(' '); return; }
  let t = b.dataset.ins;
  if (kbdPage === 'abc' && kbdShift && /^[a-z]$/.test(t)){ t = t.toUpperCase(); kbdShift = false; renderKbd(); }
  kbdRawInsert(t);
});
renderKbd();
function formatOutput(output){
  if (!output || !output.length) return '<span class="dim">（出力なし）</span>';
  return output.map(it => {
    if (it && typeof it === 'object' && '_count' in it) return 'Count : ' + it._count;
    if (it && typeof it === 'object' && 'Used' in it) return it.Free == null ? `${it.Name}　（${it.Provider || 'PSDrive'}）` : `${it.Name} ドライブ　使用 ${fmtGB(it.Used)}　空き ${fmtGB(it.Free)}`;
    if (it && typeof it === 'object' && 'WS' in it) return `${it.Name}　メモリ ${fmtMB(it.WS)}　CPU ${it.CPU}`;
    if (it && typeof it === 'object' && 'Level' in it && 'Id' in it) return `${fmtDate(it.TimeCreated)} ${it.Time}　${it.LevelDisplayName}　ID:${it.Id}　${it.Message}`;
    if (it && typeof it === 'object' && 'DisplayVersion' in it && 'Publisher' in it) return `${it.DisplayName}　${it.DisplayVersion}　${it.Publisher}`;
    if (it && typeof it === 'object' && 'TcpTestSucceeded' in it) return `${it.ComputerName}　ポート ${it.RemotePort}　${it.TcpTestSucceeded ? '接続OK' : '接続できません'}`;
    if (it && typeof it === 'object' && 'PingSucceeded' in it) return `${it.ComputerName}　ping ${it.PingSucceeded ? 'Success' : 'TimedOut'}`;
    if (it && typeof it === 'object' && 'Status' in it && 'IPAddress' in it) return `${it.Destination}　${it.Address}　${it.Status}${it.Latency != null ? '　' + it.Latency + 'ms' : ''}`;
    if (it && typeof it === 'object' && 'Status' in it) return `${it.Name}　${it.Status}`;
    if (it && typeof it === 'object' && 'Enabled' in it) return `${it.Name}　${it.Enabled ? 'True' : 'False'}　${it.Description || ''}`;
    if (it && typeof it === 'object' && 'Name' in it) return `${it.Name}　${fmtSize(it.Length)}　${fmtDate(it.LastWriteTime)}`;
    if (it && typeof it === 'object' && 'Message' in it) return `${it.Time}　${it.LevelDisplayName}　${it.ProviderName}　${it.Message}`;
    return String(it);
  }).join('\n');
}
function feedback(html, ok){
  const p = $('feedback-panel'); p.classList.remove('hidden');
  const t = $('feedback-text'); t.innerHTML = html; t.className = 'feedback ' + (ok ? 'ok' : 'ng');
}
function markCleared(q){
  const arr = clearedStages(q.theme);
  if (!arr.includes(q.stage)){ arr.push(q.stage); save.cleared[q.theme] = arr; }
  if (q.stage === 4) save.scripts[q.theme] = $('cmd-input').value;
  if (q.stage === 5) save.auto[q.theme] = true;
  persist();
}
function diffText(r){
  if (!r.diff) return '';
  let s = '';
  if (r.diff.remaining.length) s += '<br>まだ Downloads に残っている： ' + r.diff.remaining.join('、');
  if (r.diff.extra.length) s += '<br>動かなくてよいものが動いている： ' + r.diff.extra.join('、');
  return s;
}
$('btn-fix4').addEventListener('click', () => { seTap(); const q4 = QUESTS.find(x => x.theme === currentQuest.theme && x.stage === 4); if (q4) openQuest(q4); });
$('btn-reset').addEventListener('click', () => { seTap(); openQuest(currentQuest); });
$('btn-run').addEventListener('click', () => {
  const q = currentQuest; const src = $('cmd-input').value.trim();
  $('btn-next').classList.add('hidden');
  if (!src){ seNg(); feedback('コマンドが入力されていません。', false); return; }
  seRun();
  // display run
  const dispEnv = themeMakeEnv(q.theme); const dispCtx = newCtx();
  try {
    if (q.stage === 5 && save.scripts[q.theme]) loadDefs(save.scripts[q.theme], dispEnv, dispCtx);
    runProgram(src, dispEnv, dispCtx);
  } catch (e) {
    $('out-panel').classList.add('hidden');
    seNg();
    feedback('実行エラー： ' + e.message, false);
    return;
  }
  $('out-panel').classList.remove('hidden');
  $('out-text').innerHTML = formatOutput(dispCtx.output);
  $('quest-env').innerHTML = envHtml(dispEnv);
  if (q.stage === 5){
    if (dispCtx.autoRun){
      feedback('自動実行を登録しました。『1か月進める』で翌月の様子を見てみましょう。', true);
      $('btn-advance').classList.remove('hidden');
    } else {
      feedback('まだ自動実行が登録されていません。Register-AutoRun で登録してください。', false);
    }
    return;
  }
  const preload = q.stage === 5 ? (save.scripts[q.theme] || '') : undefined;
  const r = judge(q, src, preload);
  if (r.pass){
    markCleared(q);
    seOk();
    feedback('✔ クリア！ 依頼どおりの結果になりました。' + (q.clearMemo ? '<br><span style="font-size:12.5px;color:var(--sub)">' + q.clearMemo + '</span>' : ''), true);
    const next = QUESTS.find(x => x.theme === q.theme && x.stage === q.stage + 1);
    if (next){ const b = $('btn-next'); b.classList.remove('hidden'); b.onclick = () => openQuest(next); }
  } else if (r.code === 'hidden-named'){
    seNg();
    const p = (q.hiddenTest && q.hiddenTest.param) || '引数';
    feedback('関数を ' + p + ' の名前付きで呼び出す形になっていません。引数名を ' + p + ' にしてください（param(' + p + ') の形でも構いません）。段階5でも名前付きで呼ばれるので、今のうちに直しておきましょう。', false);
  } else if (r.code === 'hidden-fixed'){
    seNg();
    const p = (q.hiddenTest && q.hiddenTest.param) || '引数';
    feedback('引数の値を変えて試しても、結果が変わりませんでした。関数の中で ' + p + ' を使って絞り込んでいますか？（値を直接書き込むと、別の値で呼ばれたときに動きません）', false);
  } else if (!r.funcOk){
    seNg();
    feedback('関数の形になっていません。function で ' + q.requireFunction + ' を定義し、呼び出すところまで書いてください。', false);
  } else if (r.code === 'removed'){
    seNg();
    feedback('ファイルが完全に消えています。Remove-Item はごみ箱に入らず完全に消えてしまうので、移動には Move-Item を使います。消えたファイル： ' + r.removed.join('、'), false);
  } else if (!r.outputOk){
    seNg();
    feedback('出力が依頼と違います。対象のファイルと並び順を確認してください。', false);
  } else {
    seNg();
    feedback('結果の状態が依頼と違います。' + diffText(r), false);
  }
});
$('btn-advance').addEventListener('click', () => {
  const q = currentQuest; const src = $('cmd-input').value.trim();
  const preload = save.scripts[q.theme] || '';
  const r = judge(q, src, preload);
  // show the simulated time skip on a display env
  const env = themeMakeEnv(q.theme); const ctx = newCtx();
  try {
    if (preload) loadDefs(preload, env, ctx);
    runProgram(src, env, ctx);
    const before = stateSnapshot(env);
    simulate(q, env, ctx);
    const after = stateSnapshot(env);
    const dest = q.sim.destName;
    const moved = (after[dest] || []).filter(n => !(before[dest] || []).includes(n));
    const verb = q.sim.verb || 'へ移動';
    let changeText;
    if (q.sim.stateKey){
      const bk = q.sim.stateKey;
      const changed = (after[bk] || []).filter(n => !(before[bk] || []).includes(n))
        .map(n => n.replace(/:(true|false)$/, (m, v) => v === 'false' ? ' を無効化' : ' を有効化'));
      changeText = changed.length ? (q.sim.stateLabel || '自動実行で変わったもの：') + '\n' + changed.join('\n') : '自動実行で変化したものはありません';
    } else if (q.sim.goneFrom){
      const gone = (before[q.sim.goneFrom] || []).filter(n => !(after[q.sim.goneFrom] || []).includes(n));
      changeText = gone.length ? (q.sim.goneLabel || '自動実行で無くなったもの：') + '\n' + gone.join('\n') : '自動実行で変化したものはありません';
    } else {
      changeText = moved.length ? '自動実行で ' + dest + ' ' + verb + '：\n' + moved.join('\n') : '自動実行で変化したものはありません';
    }
    $('out-panel').classList.remove('hidden');
    $('out-text').innerHTML = '— ' + q.sim.pastText + ' —\n' + changeText;
    $('quest-env').innerHTML = envHtml(env);
  } catch (e) { feedback('実行エラー： ' + e.message, false); return; }
  if (r.pass){
    markCleared(q);
    seOk();
    feedback('✔ クリア！ 登録したスクリプトが自動で片付けてくれました。このテーマは自動化済みです。' + (q.clearMemo ? '<br><span style="font-size:12.5px;color:var(--sub)">' + q.clearMemo + '</span>' : ''), true);
    $('btn-advance').classList.add('hidden');
  } else {
    seNg();
    let msg = '自動実行後の状態が依頼と違います。' + (q.sim.failHint || diffText(r));
    if (preload) msg += '<br><span style="font-size:12.5px;color:var(--sub)">読み込まれている段階4の関数：<br>' + preload.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</span>';
    feedback(msg, false);
    $('btn-fix4').classList.remove('hidden');
  }
});
renderAuto();
setBg('assets/bg-common.jpg');
