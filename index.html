<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PIPE IT! — Script More, Work Less</title>
<meta name="description" content="PIPE IT! — PowerShellで運用作業をこなし、スクリプトで自動化していくゲーム。">
<link rel="icon" type="image/png" sizes="32x32" href="assets/appicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/appicon-180.png">
<style>
  :root{
    --bg:#04150e; --panel:rgba(8,38,24,.92); --panel2:#0a2e1c;
    --line:#2c7a4b; --ink:#f2f7e8; --sub:#a8c8a0;
    --yellow:#ffe81a; --lime:#b6e62e; --green:#37c978; --red:#ff7a6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#020a06;overflow-x:hidden;overflow-x:clip}
  body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;color:var(--ink);overscroll-behavior:none}
  .wrap{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
    background-size:cover;background-position:top center;background-repeat:no-repeat}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  /* title */
  #screen-title{text-align:center;padding-top:8dvh}
  #screen-title img.logo{width:min(88%,360px);height:auto;display:block;margin:0 auto}
  .bigbtn{display:block;width:100%;margin:14px 0 0;padding:16px 14px;font-size:17px;font-weight:800;
    text-align:left;color:#081c10;background:linear-gradient(180deg,var(--yellow),var(--lime));
    border:0;border-radius:12px;cursor:pointer}
  .bigbtn:active{filter:brightness(1.1)}
  #btn-start{text-align:center}
  #btn-run, #btn-reset{text-align:center}
  .btnrow{display:flex;gap:10px;margin-top:14px}
  .btnrow .bigbtn, .btnrow .ghostbtn{flex:1 1 0;margin:0}
  .ghostbtn{display:block;width:100%;margin:10px 0 0;padding:14px;font-size:15px;font-weight:700;
    text-align:left;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer}
  .ghostbtn:disabled{opacity:.45;cursor:default}
  .note{font-size:11.5px;color:var(--sub);line-height:1.7;margin-top:18px}
  /* headers */
  .bar{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .back{flex:0 0 auto;background:var(--panel);color:var(--ink);border:2px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer}
  .bar h2{margin:0;font-size:17px;line-height:1.3}
  .bar .sub{font-size:12px;color:var(--sub)}
  /* theme / stage lists */
  .tbtn{display:flex;width:100%;align-items:center;gap:12px;margin:10px 0;padding:12px 14px;
    background:var(--panel);border:2px solid var(--line);border-radius:12px;cursor:pointer;color:var(--ink);text-align:left}
  .tbtn:disabled{opacity:.5;cursor:default}
  .tbtn img{width:44px;height:44px;object-fit:contain;flex:0 0 auto}
  .tbtn .tt{flex:1 1 auto;min-width:0}
  .tbtn .tt b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tbtn .tt span{font-size:12px;color:var(--sub)}
  .badge{flex:0 0 auto;font-size:11px;font-weight:800;color:#081c10;background:var(--lime);
    border-radius:999px;padding:4px 10px;white-space:nowrap}
  .badge.dim{background:#37503f;color:var(--sub)}
  .dots{font-size:12px;color:var(--yellow);letter-spacing:2px;white-space:nowrap}
  /* game */
  .panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
  .panel h3{margin:0 0 6px;font-size:13px;color:var(--lime);letter-spacing:.08em}
  .panel p{margin:0;font-size:14px;line-height:1.75}
  .env{font-size:12.5px;line-height:1.5}
  .env .folder{margin:8px 0 2px;font-weight:800;color:var(--yellow);font-size:13px}
  .env table{width:100%;border-collapse:collapse}
  .env td{padding:3px 4px;border-bottom:1px solid rgba(60,140,90,.35);vertical-align:middle}
  .env td.n{word-break:break-all}
  .env td.r{text-align:right;white-space:nowrap;color:var(--sub)}
  .env img{width:22px;height:22px;object-fit:contain;vertical-align:middle}
  .env .empty{color:var(--sub);padding:2px 4px}
  .env .loglines{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.75;padding:2px 4px;word-break:break-all}
  textarea{width:100%;min-height:76px;background:#03130b;color:#eaffea;border:2px solid var(--line);
    border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:16px;line-height:1.6;resize:vertical}
  .kbd{margin:8px 0 0;display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .kbd .krow{display:flex;gap:5px}
  .kbd .key{flex:1 1 0;min-width:0;height:46px;background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);
    border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;cursor:pointer;padding:0}
  .kbd .key:active{background:var(--line)}
  .kbd .key.wide{flex:2.2 1 0}
  .kbd .key.space{flex:4 1 0}
  .kbd .key.on{background:var(--yellow);color:#1a2b12;font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
  .chip{background:var(--panel2);color:var(--ink);border:1.5px solid var(--line);border-radius:999px;
    padding:6px 11px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;cursor:pointer}
  .chip:active{background:var(--line)}
  .out{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;word-break:break-all}
  .out .dim{color:var(--sub)}
  .feedback{font-size:14.5px;line-height:1.7}
  .feedback.ok{color:var(--lime);font-weight:700}
  .feedback.ng{color:var(--red)}
  .autobar{height:12px;background:#0a2e1c;border:1.5px solid var(--line);border-radius:999px;overflow:hidden;margin:8px 0 4px}
  .autobar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--lime))}
  .autotext{font-size:13px;color:var(--sub)}
  .autotext b{color:var(--yellow);font-size:15px}
  .hidden{display:none}
  footer{margin-top:22px;text-align:center;color:var(--sub);font-size:11px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap" id="wrap">

  <!-- title -->
  <section id="screen-title">
    <h1 class="sr">PIPE IT! — Script More, Work Less</h1>
    <img class="logo" src="assets/logo.jpg" alt="PIPE IT! — Script More, Work Less">
    <button class="bigbtn" id="btn-start">▶ はじめる</button>
    <div class="panel" style="text-align:left"><h3>自動化の進み具合</h3><div class="autobar"><i id="auto-fill" style="width:0%"></i></div><div class="autotext" id="auto-text"></div></div>
    <p class="note">PowerShell のコマンドで日々の運用作業をこなすゲームです。（バージョン 0.17）最初は手打ち、覚えたらスクリプト化、そして自動化へ。<br>Microsoft、Windows、PowerShell は Microsoft グループの商標です。本アプリは非公式の学習ゲームで、Microsoft とは関係ありません。</p>
  </section>

  <!-- themes -->
  <section id="screen-themes" class="hidden">
    <div class="bar"><h2>業務テーマを選ぶ</h2></div>
    <div class="autotext" id="theme-auto" style="margin:-4px 0 6px"></div>
    <div id="theme-list"></div>
    <footer>クリアした段階は端末に保存されます</footer>
  </section>

  <!-- stages -->
  <section id="screen-stages" class="hidden">
    <div class="bar"><button class="back" data-back="themes">← テーマ</button><div><h2 id="stage-theme-name"></h2><div class="sub">段階を選ぶ</div></div></div>
    <div id="stage-list"></div>
  </section>

  <!-- game -->
  <section id="screen-game" class="hidden">
    <div class="bar"><button class="back" data-back="stages">← 段階</button><div style="flex:1 1 auto"><h2 id="game-title"></h2><div class="sub" id="game-sub"></div></div></div>
    <div class="panel"><h3>依頼</h3><p id="quest-request"></p></div>
    <div class="panel"><h3>いまの環境</h3><div class="env" id="quest-env"></div></div>
    <div class="panel" id="script-panel"><h3>コマンド</h3>
      <textarea id="cmd-input" readonly inputmode="none" spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off" lang="en" placeholder="下のキーボードとチップで入力"></textarea>
      <div class="kbd" id="kbd"></div>
      <div class="chips" id="chips"></div>
      <div class="btnrow">
        <button class="bigbtn" id="btn-run">実行する</button>
        <button class="ghostbtn" id="btn-reset">やり直す</button>
      </div>
      <button class="bigbtn hidden" id="btn-advance" style="background:linear-gradient(180deg,#8be04e,#37c978)">▶▶ 1か月進める（自動実行）</button>
    </div>
    <div class="panel hidden" id="out-panel"><h3>出力</h3><div class="out" id="out-text"></div></div>
    <div class="panel hidden" id="feedback-panel"><div class="feedback" id="feedback-text"></div>
      <button class="bigbtn hidden" id="btn-next">▶ 次の段階へ</button>
      <button class="ghostbtn hidden" id="btn-fix4">段階4の関数を直す</button>
    </div>
  </section>

</div>
<script id="core">
'use strict';
/* ================= data ================= */
const FOLDERS = ['Downloads', 'Archive', 'Trash'];
/* base data: Length is written in KB here and converted to bytes (as in real
   PowerShell); LastWriteTime is written as "days ago" and converted to a
   date value (today = 0, n days ago = -n), so comparisons read like the real
   thing: $_.LastWriteTime -le (Get-Date).AddDays(-90) */
function baseFiles(){ return [
  {Name:'見積書_2025.xlsx',   Length:240,  LastWriteTime:12,  Extension:'.xlsx'},
  {Name:'会議メモ.txt',       Length:8,    LastWriteTime:3,   Extension:'.txt'},
  {Name:'setup_cache.tmp',    Length:1500, LastWriteTime:120, Extension:'.tmp'},
  {Name:'写真_旅行.jpg',      Length:3200, LastWriteTime:45,  Extension:'.jpg'},
  {Name:'temp_work.tmp',      Length:64,   LastWriteTime:200, Extension:'.tmp'},
  {Name:'報告書_第1四半期.docx', Length:380, LastWriteTime:210, Extension:'.docx'},
  {Name:'backup_old.zip',     Length:5200, LastWriteTime:400, Extension:'.zip'},
  {Name:'download_partial.tmp', Length:890, LastWriteTime:30, Extension:'.tmp'},
  {Name:'音楽サンプル.mp3',   Length:4100, LastWriteTime:15,  Extension:'.mp3'},
  {Name:'old_notes.txt',      Length:22,   LastWriteTime:190, Extension:'.txt'},
  {Name:'設計図_v2.pdf',      Length:760,  LastWriteTime:95,  Extension:'.pdf'},
  {Name:'cache2.tmp',         Length:45,   LastWriteTime:95,  Extension:'.tmp'},
  {Name:'old_cache.tmp',      Length:30,   LastWriteTime:91,  Extension:'.tmp'},
  {Name:'recent_work.tmp',    Length:28,   LastWriteTime:89,  Extension:'.tmp'},
  {Name:'集計データ.csv',     Length:100,  LastWriteTime:50,  Extension:'.csv'},
  {Name:'手順書_改訂.pdf',    Length:150,  LastWriteTime:20,  Extension:'.pdf'}
];}
function toFile(f){
  return { Name:f.Name, Length: Math.round(f.Length * 1024), LastWriteTime:{ __date:-f.LastWriteTime }, Extension:f.Extension, Folder:'Downloads' };
}
function makeEnv(){
  const env = {Downloads:[], Archive:[], Trash:[]};
  for (const f of baseFiles()) env.Downloads.push(toFile(f));
  env.Downloads.sort((a, b) => a.Name.localeCompare(b.Name, 'ja'));
  return env;
}
function fmtDate(dv){
  const base = new Date(); base.setDate(base.getDate() + dv.__date);
  return base.getFullYear() + '/' + (base.getMonth() + 1) + '/' + base.getDate();
}
/* ---- theme: log ----
   Log lines are plain TEXT lines (like real Get-Content output):
   "HH:MM LEVEL SOURCE message". Searching is done with -like patterns. */
function baseLines(){ return [
  '08:58 INFO Web サーバー起動',
  '09:01 INFO 決済 決済サービス接続OK',
  '09:03 WARN DB 接続プール使用率80%',
  '09:05 ERROR アプリ timeout: 注文API応答なし',
  '09:12 ERROR 決済 timeout: 決済ゲートウェイ応答なし',
  '09:18 WARN アプリ メモリ使用率85%',
  '09:21 ERROR アプリ timeout: 在庫API応答なし',
  '09:30 ERROR DB 接続エラー: 接続が拒否されました',
  '09:40 ERROR 決済 カード検証エラー',
  '09:52 INFO DB バックアップ完了',
  '10:02 INFO Web 定期ヘルスチェックOK',
  '10:06 ERROR 決済 timeout: 決済ゲートウェイ応答なし',
  '10:11 WARN 決済 決済キューの滞留',
  '10:15 ERROR 決済 二重請求の検知',
  '10:23 ERROR アプリ timeout: 配送API応答なし',
  '10:29 ERROR アプリ 決済 API応答なし',
  '10:31 INFO 決済 決済完了 98件',
  '10:36 ERROR 決済 残高照会エラー',
  '10:40 ERROR Web 502エラー多発',
  '10:47 WARN DB レプリケーション遅延',
  '11:03 INFO アプリ 定期ジョブ完了',
  '11:15 ERROR 決済 決済ゲートウェイ接続断',
  '11:32 WARN Web 応答時間の悪化'
];}
function makeLogEnv(){
  return { Log: baseLines(), Alerts: [] };
}
/* ---- theme: disk ---- */
const GB = 1024 * 1024 * 1024;
function baseDrives(){ return [
  {Name:'C', Used:180, Free:35},
  {Name:'D', Used:700, Free:300},
  {Name:'E', Used:95,  Free:5},
  {Name:'F', Used:450, Free:8},
  {Name:'G', Used:120, Free:12},
  {Name:'H', Used:980, Free:20}
];}
const EXTRA_DRIVES = [
  {Name:'Alias', Provider:'Alias', Used:null, Free:null},
  {Name:'Cert', Provider:'Certificate', Used:null, Free:null},
  {Name:'Env', Provider:'Environment', Used:null, Free:null},
  {Name:'HKLM', Provider:'Registry', Used:null, Free:null}
];
function makeDiskEnv(){
  return { Drives: baseDrives().map(d => ({ Name:d.Name, Used:d.Used * GB, Free:d.Free * GB })), PSDrivesExtra: EXTRA_DRIVES.map(d => ({ ...d })), Report: [] };
}
/* ---- theme: process ---- */
const MB = 1024 * 1024;
function baseProcesses(){ return [
  {Name:'backup-agent',   Id:3100, WS:640,  CPU:120.0},
  {Name:'chrome',         Id:2400, WS:1200, CPU:820.3},
  {Name:'explorer',       Id:4100, WS:150,  CPU:60.5},
  {Name:'notepad',        Id:4800, WS:25,   CPU:1.2},
  {Name:'powershell',     Id:4600, WS:90,   CPU:12.4},
  {Name:'sqlservr',       Id:1200, WS:2400, CPU:1500.5},
  {Name:'svchost',        Id:900,  WS:180,  CPU:45.0},
  {Name:'Teams',          Id:3300, WS:580,  CPU:300.2}
];}
function baseServices(){ return [
  {Name:'BackupService', Status:'Stopped', StartType:'Automatic'},
  {Name:'MonitorAgent',  Status:'Stopped', StartType:'Automatic'},
  {Name:'Spooler',       Status:'Running', StartType:'Automatic'},
  {Name:'UpdateService', Status:'Stopped', StartType:'Disabled'},
  {Name:'W32Time',       Status:'Stopped', StartType:'Manual'},
  {Name:'WinRM',         Status:'Running', StartType:'Manual'}
];}
function toProcess(d){ return { Name:d.Name, Id:d.Id, WS:d.WS * MB, CPU:d.CPU }; }
function makeProcessEnv(){
  return { Processes: baseProcesses().map(toProcess), Services: baseServices().map(s => ({...s})) };
}
/* ---- theme: users ---- */
const SID_PREFIX = 'S-1-5-21-3623811015-3361044348-30300820-';
function baseUsers(){ return [
  {Name:'Administrator', Enabled:true,  LastLogonDays:300, Description:'緊急用の管理者', SID:SID_PREFIX + '500'},
  {Name:'backup-admin',  Enabled:true,  LastLogonDays:30,  Description:'管理者（予備）', SID:SID_PREFIX + '1000'},
  {Name:'guest-trainee', Enabled:true,  LastLogonDays:250, Description:'研修用ゲスト', SID:SID_PREFIX + '1001'},
  {Name:'hanako.qa',     Enabled:false, LastLogonDays:500, Description:'QA用', SID:SID_PREFIX + '1002'},
  {Name:'ito',           Enabled:true,  LastLogonDays:160, Description:'開発部', SID:SID_PREFIX + '1003'},
  {Name:'kobayashi',     Enabled:true,  LastLogonDays:120, Description:'総務部', SID:SID_PREFIX + '1004'},
  {Name:'sato',          Enabled:true,  LastLogonDays:200, Description:'営業部', SID:SID_PREFIX + '1005'},
  {Name:'shinjin',       Enabled:true,  LastLogonDays:null, Description:'来週入社予定', SID:SID_PREFIX + '1006'},
  {Name:'suzuki',        Enabled:true,  LastLogonDays:5,   Description:'開発部', SID:SID_PREFIX + '1007'},
  {Name:'tanaka',        Enabled:true,  LastLogonDays:2,   Description:'営業部', SID:SID_PREFIX + '1008'},
  {Name:'yamada',        Enabled:true,  LastLogonDays:400, Description:'営業部（退職済み）', SID:SID_PREFIX + '1009'}
];}
function toUser(d){ return { Name:d.Name, Enabled:d.Enabled, Description:d.Description || '', SID:d.SID || '', LastLogon: d.LastLogonDays == null ? null : { __date: -d.LastLogonDays } }; }
function makeUsersEnv(){
  return { Users: baseUsers().map(toUser) };
}
/* ---- theme: backup ---- */
function baseBackupSet(){ return [
  {Name:'売上集計.xlsx', Folder:'Data', Length:300, LastWriteTime:2},
  {Name:'顧客リスト.csv', Folder:'Data', Length:150, LastWriteTime:1},
  {Name:'議事録.docx', Folder:'Data', Length:80, LastWriteTime:3},
  {Name:'見積書.docx', Folder:'Data', Length:60, LastWriteTime:6},
  {Name:'在庫表.xlsx', Folder:'Data', Length:120, LastWriteTime:0},
  {Name:'写真_現場.jpg', Folder:'Data', Length:3000, LastWriteTime:10},
  {Name:'メモ.txt', Folder:'Data', Length:5, LastWriteTime:15},
  {Name:'設計書.pdf', Folder:'Data', Length:2000, LastWriteTime:40},
  {Name:'売上集計.xlsx', Folder:'Backup', Length:280, LastWriteTime:8},
  {Name:'顧客リスト.csv', Folder:'Backup', Length:140, LastWriteTime:8},
  {Name:'議事録.docx', Folder:'Backup', Length:75, LastWriteTime:9},
  {Name:'設計書.pdf', Folder:'Backup', Length:2000, LastWriteTime:40}
];}
function toBackupFile(f){
  return { Name:f.Name, Length: Math.round(f.Length * 1024), LastWriteTime:{ __date:-f.LastWriteTime }, Extension: f.Extension || f.Name.slice(f.Name.lastIndexOf('.')), Folder:f.Folder };
}
function makeBackupEnv(){
  const env = { Data: [], Backup: [] };
  for (const raw of baseBackupSet()) env[raw.Folder].push(toBackupFile(raw));
  return env;
}
/* ---- theme: network ---- */
function baseHosts(){ return [
  {Name:'vpn-gateway', IPAddress:'192.168.1.1',  Reachable:true,  Latency:1,  Ports:{}},
  {Name:'web-server',  IPAddress:'192.168.1.10', Reachable:true,  Latency:1, Ports:{80:true, 443:true}},
  {Name:'db-server',   IPAddress:'192.168.1.20', Reachable:true,  Latency:2, Ports:{1433:true}},
  {Name:'file-server', IPAddress:'192.168.1.30', Reachable:false, Latency:null, DownStatus:'DestinationHostUnreachable', Ports:{}},
  {Name:'mail-server', IPAddress:'192.168.1.40', Reachable:true,  Latency:30, Ports:{587:true}},
  {Name:'printer',     IPAddress:'192.168.1.50', Reachable:true,  Latency:0,  Ports:{9100:true}}
];}
function makeNetworkEnv(){
  return { targets: baseHosts().map(h => h.Name), Hosts: baseHosts().map(h => ({ ...h, Ports: { ...h.Ports } })), PSVersion: ['7.4.0'] };
}
/* ---- theme: software ---- */
function basePackages(){ return [
  {DisplayName:'Adobe Acrobat Reader DC', DisplayVersion:'24.0.0', Publisher:'Adobe Inc.', InstallDays:30},
  {DisplayName:'Adobe Flash Player 32', DisplayVersion:'32.0.0', Publisher:'Adobe Systems Incorporated', InstallDays:1500},
  {DisplayName:'Google Chrome', DisplayVersion:'150.0.7871.100', Publisher:'Google LLC', InstallDays:10},
  {DisplayName:'Java 8 Update 202', DisplayVersion:'8.0.2020.8', Publisher:'Oracle Corporation', InstallDays:1200},
  {DisplayName:'Microsoft Office 2021', DisplayVersion:'16.0.14334', Publisher:'Microsoft Corporation', InstallDays:200},
  {DisplayName:'Slack', DisplayVersion:'4.38.0', Publisher:'Slack Technologies, Inc.', InstallDays:60},
  {DisplayName:'WinZip 20', DisplayVersion:'20.0.0', Publisher:'Corel Corporation', InstallDays:900},
  {DisplayName:'Zoom', DisplayVersion:'6.0.0', Publisher:'Zoom Video Communications, Inc.', InstallDays:null},
  {DisplayName:'iTunes', DisplayVersion:'12.12.0', Publisher:'Apple Inc.', InstallDays:710},
  {DisplayName:'ウイルスバスター クラウド', DisplayVersion:'17.0.0', Publisher:'Trend Micro Inc.', InstallDays:100}
];}
function toPackage(p){
  return { DisplayName:p.DisplayName, DisplayVersion:p.DisplayVersion, Publisher:p.Publisher, InstallDate: p.InstallDays == null ? '' : fmtYMD(-p.InstallDays), InstallDays: p.InstallDays };
}
function makeSoftwareEnv(){
  return { Packages: basePackages().map(toPackage) };
}
/* ---- theme: events ---- */
function baseEvents(){ return [
  {d:0, Time:'09:12', Id:7034, Level:2, ProviderName:'Service Control Manager', Message:'Print Spooler サービスは予期せぬ原因により終了しました。このサービスの終了は 3 回目です。'},

function csvCell(v){
  if (v == null) return '';
  if (typeof v === 'object' && '__date' in v) v = fmtDate(v);
  const s = String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function csvOf(items, typeInfo){
  if (!items.length) return [];
  const props = Object.keys(items[0]).filter(k => k !== 'InstallDays');
  const lines = [props.join(',')].concat(items.map(it => props.map(k => csvCell(it[k])).join(',')));
  if (typeInfo) lines.unshift('#TYPE System.Management.Automation.PSCustomObject');
  return lines;
}
function parseCsvLine(line){
  const out = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++){
    const c = line[i];
    if (inQ){
      if (c === '"'){ if (line[i + 1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"') inQ = true;
    else if (c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur);
  return out;
}

  { id:'backup-1', theme:'backup', stage:1, title:'Dataフォルダの中身を見る',

  { id:'backup-3', theme:'backup', stage:3, title:'変わったものだけコピーし直す',
    request:'「毎回全部コピーすると時間がかかる。Backup と比べて、Backup にまだ無いファイルか、Data の方が新しいファイルだけ、Backup にコピーし直してくれ。1つずつ調べて、条件に合うものだけだ」',
    solution:'foreach ($f in Get-ChildItem Data) {\n  $b = Get-ChildItem Backup -Filter $f.Name\n  if ($null -eq $b -or $f.LastWriteTime -gt $b.LastWriteTime) {\n    $f | Copy-Item -Destination Backup\n  }\n}', judge:'state',
    clearMemo:'実務メモ： 「◯日以内に更新されたものだけ」という日数の窓で差分を取ると、ジョブが1回失敗したり遅れたりしただけで、窓の外に出た変更が黙って漏れます。コピー先と比べて「無いもの・古いもの」を拾う形が安全で、robocopy の既定の動き（サイズか時刻が違うものだけコピー）もこの考え方です。',
    chips:['foreach','($f in Get-ChildItem Data)','{','}','$b = Get-ChildItem Backup -Filter $f.Name','if ($null -eq $b -or $f.LastWriteTime -gt $b.LastWriteTime)','$f','|','Copy-Item','-Destination','Backup'] },

    request:'「この『比べてコピーする』処理を、使い回せる関数にしてくれ。名前は Copy-ChangedFile、引数 $Source でコピー元、$Destination でコピー先のフォルダを受け取る動きで。作ったら Data から Backup へ実行してくれ」',

    judge:'state', requireFunction:'Copy-ChangedFile', hiddenTest:{ calls:['Copy-ChangedFile -Source Backup -Destination Data'], param:'$Source' },

    clearMemo:'実務メモ： Register-AutoRun はゲーム内専用コマンドです。実務ではタスクスケジューラに Register-ScheduledTask で登録するか、robocopy を定期実行します。robocopy は既定で「変わったものだけ」をコピーするので /MAXAGE のような日数指定は通常使いません。注意点は2つ。終了コードは 0〜7 が成功（1 は「コピーした」という意味）で、8 以上が失敗です。「0 以外は失敗」と判定すると毎回失敗に見えます。もう1つ、/MIR はコピー元に無いファイルをコピー先から消すので、元の削除や暗号化までそのまま写ります。/MIR だけではバックアップになりません。あと、この上書き式は1世代しか残りません。壊れたファイルが良い版を上書きしてしまうので、実務では日付フォルダなどで複数世代を残します。そして、バックアップは「取れているか」より「戻せるか」が本番です。定期的なリストア訓練まで含めて運用です。',

    clearMemo:'実務メモ： Register-AutoRun はゲーム内専用コマンドです。実務ではタスクスケジューラに Register-ScheduledTask で登録し、レポートはメールで送ったり共有フォルダに置いたりして届けます。実務では、スクリプトファイル（.ps1）に保存したものを登録するのが本当の形で、実行ポリシーで止められることもあります。文字コードにも注意： Windows PowerShell 5.1 では書き出しの既定の文字コードがコマンドごとに違い、混ぜると日本語が文字化けします。-Encoding utf8 に揃えるのが安全です（PowerShell 7 の既定は UTF-8）。ここまでが基本の10テーマです。手で打つ→パイプでつなぐ→条件で絞る→関数にする→自動で回す。この流れが身につけば、日常の運用はかなり楽になります。この先の追加テーマでは、エラー処理や安全な実行など、実務の守りを学びます。',
    chips:['Register-AutoRun','{','New-DailyReport daily-report.log','}'] },
  { id:'err-1', theme:'errors', stage:1, title:'版を確かめ、該当なしでもエラーにしない',
    request:'「このテーマの環境は Windows PowerShell 5.1 です（テーマ7は PowerShell 7 でした。版で挙動が変わるので、まず $PSVersionTable.PSVersion で版を確かめてくれ）。そのうえで、イベントID 9999 のイベントがあるか調べてくれ。Get-WinEvent の -FilterHashtable で指定する形で頼む。1件も見つからないと Get-WinEvent はエラーを出すので、まずは -ErrorAction を付けずに打って、どんなエラーが出るか目で見てみよう。見たら、-ErrorAction SilentlyContinue を付けて静かに終わらせてくれ」',
    solution:"$PSVersionTable.PSVersion\nGet-WinEvent -FilterHashtable @{LogName='System'; Id=9999} -ErrorAction SilentlyContinue", judge:'output',
    clearMemo:'実務メモ： -FilterHashtable で1件も一致しないと、Get-WinEvent は「指定された条件に一致するイベントがありません」というエラーを出します。このエラーは「終了しないエラー」で、処理は止まらず表示だけされます。自動実行のスクリプトでは、このエラーが毎回記録されて本当の障害が埋もれます。-ErrorAction SilentlyContinue は「表示せず、黙って続ける」指定です。ただし抑止しても、エラー自体は $Error という記録には残ります（表示が消えただけで、無かったことにはなりません）。そして最初にやった $PSVersionTable の確認は実務の初手です。版が違うと、この先のコマンドの挙動まで変わります。',
    chips:['$PSVersionTable.PSVersion','Get-WinEvent','-FilterHashtable',"@{LogName='System'; Id=9999}",'-ErrorAction','SilentlyContinue'] },
  { id:'err-2', theme:'errors', stage:2, title:'応答の有無を名前つきで集める',
    request:'「対象リスト targets.txt のサーバー全部について、ping の応答があったかどうかを集めてくれ。ただし真偽値だけが並んでも、どのサーバーのことか分からない。foreach で1台ずつ回して、『サーバー名 結果』の形で出してくれ。Test-Connection は -Count 1 -Quiet で、応答がなくてもエラーにしないこと。この環境は 5.1 で、文字列をそのまま Test-Connection にパイプで渡すと動かないので、その形は使わないでくれ」',
    solution:'foreach ($s in Get-Content targets.txt) { "$s $(Test-Connection $s -Count 1 -Quiet)" }', judge:'output',
    clearMemo:'実務メモ： Windows PowerShell 5.1 の Test-Connection は、パイプから受け取れるのが「ComputerName というプロパティを持つオブジェクト」だけで、文字列をそのまま渡すとバインドのエラーになります（テーマ7の PowerShell 7 では文字列でも動きました）。foreach で名前を変数に入れて明示的に渡す形は、5.1 でも 7 でも同じように動きます。結果には名前を一緒に残すこと。真偽値だけの列は、後から見ても何の記録にもなりません。',
    chips:['foreach','($s in Get-Content targets.txt)','{','}','$s $(Test-Connection $s -Count 1 -Quiet)'] },
  { id:'err-3', theme:'errors', stage:3, title:'robocopy の成否を判定する',
    request:'「robocopy で Data から Backup へ差分コピーを実行してくれ。そのあと、終了コード（$LASTEXITCODE）が 8 未満なら成功として backup-status.log に『バックアップOK』、8 以上なら失敗として『バックアップ失敗（コード ○○）』と、コードつきで記録してくれ。失敗したとき何も残らないのが一番困る。なお Backup には、Data にはもう無い古いファイルも残っている」',
    solution:"robocopy Data Backup\nif ($LASTEXITCODE -lt 8) { Add-Content backup-status.log 'バックアップOK' } else { Add-Content backup-status.log \"バックアップ失敗（コード $($LASTEXITCODE)）\" }", judge:'state', failCase:'noData',
    clearMemo:'実務メモ： robocopy の終了コードはビットの組み合わせです（1＝コピーした、2＝コピー先に余分なファイルがある、4＝不一致、8＝失敗、16＝重大な失敗）。今回は「コピーした＋余分なファイルがある」で 3 でした。だから「成功は 0 か 1 だけ」という判定では、正常な実行まで失敗になります。0〜7 が成功、8 以上が失敗という判定が定番です。注意点が3つ。$LASTEXITCODE は robocopy のような外部コマンド専用で、コマンドレットの成否は見られません。robocopy は失敗しても PowerShell のエラーにはならないので、次の段階で習う try/catch では受け取れません（コマンドレットは try/catch、外部コマンドは $LASTEXITCODE、と使い分けます）。そしてタスクスケジューラでは終了コード 1 が「前回の実行結果 0x1」と表示され、失敗のように見えます。',
    chips:['robocopy','Data','Backup','if ($LASTEXITCODE -lt 8)','{','}','else','Add-Content','backup-status.log',"'バックアップOK'",'\"バックアップ失敗（コード $($LASTEXITCODE)）\"'] },
  { id:'err-4', theme:'errors', stage:4, title:'失敗しても止まらない関数にする',
    request:'「イベントIDを指定して、直近1日の発生時刻とメッセージを check.log に記録する関数を作ってくれ。名前は Save-EventRecord、引数 $Id でイベントIDを受け取る動きで。-FilterHashtable に Id と StartTime（(Get-Date).AddDays(-1)）を指定する形で頼む。該当が無いときはエラーで止まらず、『該当なし： エラーの内容』を記録すること。ここが大事なのだが、Get-WinEvent の「該当なし」は終了しないエラーで、そのまま try で囲んでも catch に入らない。-ErrorAction Stop を付けて『止まるエラー』に変えてから try/catch で受けること。catch ではエラーの種類（$_.FullyQualifiedErrorId）を見て、NoMatchingEventsFound のときだけ『該当なし』、それ以外は『取得失敗』と、内容（$_.Exception.Message）つきで記録してくれ。作ったら 9999 で実行してくれ」',
    solution:"function Save-EventRecord($Id) {\n  try { Get-WinEvent -FilterHashtable @{LogName='System'; Id=$Id; StartTime=(Get-Date).AddDays(-1)} -ErrorAction Stop | ForEach-Object { \"$($_.TimeCreated) $($_.Message)\" } | Add-Content check.log } catch { if ($_.FullyQualifiedErrorId -like 'NoMatchingEventsFound*') { Add-Content check.log \"該当なし： $($_.Exception.Message)\" } else { Add-Content check.log \"取得失敗： $($_.Exception.Message)\" } }\n}\nSave-EventRecord 9999",
    judge:'state', requireFunction:'Save-EventRecord', hiddenTest:{ calls:['Save-EventRecord -Id 7034'], param:'$Id' },
    clearMemo:'実務メモ： このテーマで一番持ち帰ってほしい一文です。try/catch は、-ErrorAction Stop で『止まるエラー（終了するエラー）』に変えてはじめて受け取れます。Get-WinEvent の「該当なし」（NoMatchingEventsFound）は終了しないエラーなので、try で囲んだだけでは catch に入らず、赤い表示が出て処理が素通りします。そして catch は全てのエラーを受けるので、中身を見ずに「該当なし」と決めつけると、ログ名の間違いや権限不足まで「無かったこと」になります。エラーの内容を記録し、種類で分けるのが、握りつぶさないための型です。',
    chips:['function','Save-EventRecord','($Id)','{','}','try','Get-WinEvent','-FilterHashtable',"@{LogName='System'; Id=$Id; StartTime=(Get-Date).AddDays(-1)}",'-ErrorAction','Stop','|','ForEach-Object','"$($_.TimeCreated) $($_.Message)"','Add-Content','check.log','catch',"if ($_.FullyQualifiedErrorId -like 'NoMatchingEventsFound*')",'"該当なし： $($_.Exception.Message)"','else','"取得失敗： $($_.Exception.Message)"','9999'] },
  { id:'err-5', theme:'errors', stage:5, title:'毎朝のチェックを自動化する',
    request:'「段階4で作った関数 Save-EventRecord を、毎朝の自動実行に登録しよう。ゲーム内コマンド Register-AutoRun に、実行したいコマンドを { } で囲んで渡してくれ。ID は 7034 で。check.log は空の状態から始まる。登録したら『2日進める』で2日分を進めよう。1日目は新しい 7034 が1件記録され、2日目は新しいものが無いので『該当なし』が記録されるはずだ」',
    solution:'Register-AutoRun { Save-EventRecord -Id 7034 }', judge:'state',
    preload:"function Save-EventRecord($Id) { try { Get-WinEvent -FilterHashtable @{LogName='System'; Id=$Id; StartTime=(Get-Date).AddDays(-1)} -ErrorAction Stop | ForEach-Object { \"$($_.TimeCreated) $($_.Message)\" } | Add-Content check.log } catch { if ($_.FullyQualifiedErrorId -like 'NoMatchingEventsFound*') { Add-Content check.log \"該当なし： $($_.Exception.Message)\" } else { Add-Content check.log \"取得失敗： $($_.Exception.Message)\" } } }",
    sim:{ label:'2日進める（自動実行）', pastText:'2日が過ぎました', destName:'check', home:'Events', failHint:'記録された内容が期待と違います。1日目は新しい 7034 が1件、2日目は『該当なし』のはずです', rounds:[
      { ageEvents:1.1, arrivals:[ {TimeCreatedDays:0, Time:'10:47', Id:7034, Level:2, ProviderName:'Service Control Manager', Message:'Print Spooler サービスは予期せぬ原因により終了しました。このサービスの終了は 4 回目です。'} ] },
      { ageEvents:1.1, arrivals:[] }
    ]},
    clearMemo:'実務メモ： Register-AutoRun はゲーム内専用コマンドです。実務ではタスクスケジューラに Register-ScheduledTask で登録します。結果を見てください。2日目は「何も起きなかった」日で、その日に『該当なし』と正しく記録できたのは、try/catch と -ErrorAction Stop のおかげです。毎朝のチェックでは、何もない日の方が多いのです。直近1日に絞っているので、過去分が積み上がることもありません。自動実行は誰も見ていないところで失敗します。エラーで止まらない作りと、失敗したことが分かる記録の両方が要ります。',
    chips:['Register-AutoRun','{','Save-EventRecord -Id 7034','}'] },
  { id:'safe-1', theme:'safety', stage:1, title:'止める前に下見する',
    request:'「メモリ（WS）が 1GB より大きいプロセスを止めたい。でも、いきなり止めるのは危ない。2手に分けてくれ。①まず -WhatIf を付けて、止めたら何が起きるかだけ見せてくれ（実際には止めない）。②出てきた一覧をよく見て、止めてはいけないもの（テーマ4で学んだ、止めると業務が止まるプロセス）が混ざっていたら、条件に -and $_.Name -ne \'sqlservr\' を足して、もう一度 -WhatIf で確かめてくれ」',
    solution:"Get-Process | Where-Object { $_.WS -gt 1GB } | Stop-Process -WhatIf\nGet-Process | Where-Object { $_.WS -gt 1GB -and $_.Name -ne 'sqlservr' } | Stop-Process -WhatIf", judge:'output',
    clearMemo:'実務メモ： -WhatIf を付けると、コマンドは実際には実行されず「何をするつもりか」だけを表示します。消す・止める・無効化する系のコマンドの安全確認の定番です。大事な性質が2つ。①下見のメッセージは画面（ホスト）に表示されるだけで、パイプラインの出力には流れません。変数に入れたりファイルに書いたりはできないのです。保存したいなら、段階3のように「対象を変数に集めて名前を書き出す」形にします。②下見は「見る」ためのもので、出てきた一覧をそのまま実行していいとは限りません。今回は sqlservr（止めると業務が止まる）が混ざっていました。下見→直す→もう一度下見、が -WhatIf の本来の使い方です。',
    chips:['Get-Process','|','Where-Object','{','}','$_.WS -gt 1GB','Stop-Process','-WhatIf',"$_.Name -ne 'sqlservr'"] },  { id:'safe-2', theme:'safety', stage:2, title:'消す前に件数を数える',
    request:'「Downloads の一時ファイル（.tmp）を掃除したい。一時ファイルは、消えても作り直せるものだから直接消してよい（業務ファイルなら、消さずに移動やアーカイブにする）。消す前に、対象が何件あるか数えてくれ。Get-ChildItem で取って、拡張子が .tmp のものを Measure-Object で数える」',
    solution:"Get-ChildItem Downloads | Where-Object { $_.Extension -eq '.tmp' } | Measure-Object", judge:'output',
    clearMemo:'実務メモ： 「消すのは最後。消す前に、まず数を確認する」が鉄則です。思っていた件数と違えば、条件が間違っているサインです。数えるだけなら何も壊れません。',
    chips:['Get-ChildItem','Downloads','|','Where-Object','{','}',"$_.Extension -eq '.tmp'",'Measure-Object'] },  { id:'safe-3', theme:'safety', stage:3, title:'数えてから消す',
    request:'「では本番だ。90日以上前の .tmp ファイルを対象にしてくれ。まず対象を変数 $targets に集める。次に安全弁だ： 対象が10件より多ければ、消さずに cleanup.log へ『件数が多すぎるため中止』と記録して終わること。10件以下なら、cleanup.log に『対象 ○ 件』と件数を記録し、続けて対象のファイル名も1行ずつ記録してから、$targets を Remove-Item で消してくれ。一時ファイルは消えても作り直せるものだから、直接消してよい」',
    solution:"$targets = Get-ChildItem Downloads | Where-Object { $_.Extension -eq '.tmp' -and $_.LastWriteTime -le (Get-Date).AddDays(-90) }\nif ($targets.Count -gt 10) { Add-Content cleanup.log '件数が多すぎるため中止' } else { Add-Content cleanup.log \"対象 $($targets.Count) 件\"; $targets | ForEach-Object { Add-Content cleanup.log $_.Name }; $targets | Remove-Item }", judge:'state',
    clearMemo:'実務メモ： 対象を一度変数に集めてから処理すると、「数えた対象」と「消した対象」が必ず同じになります。記録には件数だけでなく名前も残すこと。あとで「何が消えたか」を追えるのは名前だけです。そして安全弁： 条件の書き間違いで対象が想定よりずっと多くなる事故は現場で起きます。「多すぎたら消さずに止める」を型に入れておくと、大量削除を未然に防げます。Remove-Item はごみ箱に入らず完全に消えるので、記録とセットで使うのが作法です。',
    chips:['$targets = Get-ChildItem Downloads','|','Where-Object','{','}',"$_.Extension -eq '.tmp' -and $_.LastWriteTime -le (Get-Date).AddDays(-90)",'if ($targets.Count -gt 10)',"'件数が多すぎるため中止'",'else','Add-Content','cleanup.log','"対象 $($targets.Count) 件"','$targets','ForEach-Object','$_.Name','Remove-Item'] },  { id:'safe-4', theme:'safety', stage:4, title:'安全な削除を関数にする',
    request:'「この『数えてから消す』処理を、使い回せる関数にしてくれ。名前は Remove-OldTempFile、引数 $Days で『何日以上前の .tmp を対象にするか』を受け取る動きで。関数の中でも、消す前に cleanup.log へ『対象 ○ 件』と記録すること。さらに、この関数自体も -WhatIf で下見できるようにしてくれ。自作の関数を -WhatIf 対応にするには、関数の中に [CmdletBinding(SupportsShouldProcess)] と param($Days) を書く形にする。作ったら -Days 90 で実行してくれ」',
    solution:"function Remove-OldTempFile { [CmdletBinding(SupportsShouldProcess)] param($Days) $t = Get-ChildItem Downloads | Where-Object { $_.Extension -eq '.tmp' -and $_.LastWriteTime -le (Get-Date).AddDays(-$Days) }; Add-Content cleanup.log \"対象 $($t.Count) 件\"; $t | Remove-Item }\nRemove-OldTempFile -Days 90",
    judge:'state', requireFunction:'Remove-OldTempFile', hiddenTest:{ calls:['Remove-OldTempFile -Days 60 -WhatIf', 'Remove-OldTempFile -Days 60'], param:'$Days' },
    clearMemo:'実務メモ： [CmdletBinding(SupportsShouldProcess)] を書くと、自作の関数も -WhatIf を受け取れるようになり、中の Remove-Item などに下見が引き継がれます。これがない関数に -WhatIf を付けると「そのパラメーターはない」というエラーになります。注意： Add-Content も -WhatIf に従うので、下見のときは cleanup.log への記録も書かれません。-Confirm は実行前に確認を求める指定です。対話では有効ですが、確認は -Confirm を付けなくても出ることがあります（中身のあるフォルダを -Recurse なしで Remove-Item したときなど）。自動実行では確認待ちで止まってしまうので、無人実行では -Confirm:$false と書いて確認を出さないようにし、件数の記録で代用します。',
    chips:['function','Remove-OldTempFile','[CmdletBinding(SupportsShouldProcess)]','param($Days)','$t = Get-ChildItem Downloads','|','Where-Object',"$_.Extension -eq '.tmp' -and $_.LastWriteTime -le (Get-Date).AddDays(-$Days)",'Add-Content','cleanup.log','"対象 $($t.Count) 件"','$t','Remove-Item','-Days','90'] },  { id:'safe-5', theme:'safety', stage:5, title:'掃除を自動化する',
    request:'「段階4で作った関数 Remove-OldTempFile を、毎月の自動実行に登録しよう。ゲーム内コマンド Register-AutoRun に、実行したいコマンドを { } で囲んで渡してくれ。境界は 90日 で。登録したら『1か月進める』で次の月へ進め、古くなった一時ファイルが自動で掃除されるか確かめよう」',
    solution:'Register-AutoRun { Remove-OldTempFile -Days 90 }', judge:'state',
    preload:"function Remove-OldTempFile { [CmdletBinding(SupportsShouldProcess)] param($Days) $t = Get-ChildItem Downloads | Where-Object { $_.Extension -eq '.tmp' -and $_.LastWriteTime -le (Get-Date).AddDays(-$Days) }; Add-Content cleanup.log \"対象 $($t.Count) 件\"; $t | Remove-Item }",
    sim:{ label:'1か月進める（自動実行）', pastText:'1か月が経ちました', destName:'cleanup', ageFiles:30, failHint:'掃除されたファイルが期待と違います。1か月経って境界を越えたファイルも対象です', arrivals:[
      {Name:'new_cache.tmp', Length:50, LastWriteTime:100, Extension:'.tmp'}
    ]},
    clearMemo:'実務メモ： Register-AutoRun はゲーム内専用コマンドです。実務ではタスクスケジューラに Register-ScheduledTask で登録します。自動で消す処理は特に、件数の記録が命綱です。「いつ、何件消えたか」が残っていれば、誤削除に気づけます。',
    chips:['Register-AutoRun','{','Remove-OldTempFile -Days 90','}'] },  { id:'res-1', theme:'research', stage:1, title:'ヘルプで調べる',
    request:'「Test-Connection の使い方が分からない。Get-Help で、このコマンドの使用例（-Examples）を見せてくれ」',
    solution:'Get-Help Test-Connection -Examples', judge:'output',
    clearMemo:'実務メモ： Get-Help はコマンドの使い方を表示します。ふだんの表示には構文（SYNTAX： どの引数があり、どれが必須か）が出ます。例だけ見たいときは -Examples、全部読みたいときは -Full です。注意点： ヘルプの本文は最初からは入っていないことがあり、構文だけが出て「Update-Help でヘルプを更新しろ」という注意が表示されます（Windows PowerShell 5.1 では管理者権限が必要です）。ブラウザーで開いて読みたいときは -Online です。分からないコマンドに出会ったら、まずヘルプ。これが現場で自立するための第一歩です。',
    chips:['Get-Help','Test-Connection','-Examples'] },  { id:'res-2', theme:'research', stage:2, title:'プロパティを探す',
    request:'「ユーザーアカウントには、画面に出ていない項目もありそうだ。Get-LocalUser の結果を Get-Member に渡して、プロパティ（項目）だけを見せてくれ。-MemberType Property で絞る形で頼む。先頭に出る TypeName（型の名前）もよく見ておいてくれ」',
    solution:'Get-LocalUser | Get-Member -MemberType Property', judge:'output',
    clearMemo:'実務メモ： Get-Member は、オブジェクトが持つプロパティとメソッドを全部表示します。-MemberType Property を付けるとプロパティだけに絞れます。先頭の TypeName は型の名前で、ドキュメントを探したり検索したりするときの手がかりになります。プロパティは十数件あります。この「たくさんの中から目的の項目（LastLogon など）を見つける」のが、調べる作業の本題です。テーマ5で「LastLogon は既定の表示に出ない」と学びましたが、こういう隠れた項目は Get-Member で見つけます。',
    chips:['Get-LocalUser','|','Get-Member','-MemberType','Property'] },  { id:'res-3', theme:'research', stage:3, title:'項目を選んで、未ログインと分けて示す',
    request:'「LastLogon（最終ログイン）で危ないアカウントを示したい。まず Get-LocalUser を Select-Object Name, LastLogon で『名前と最終ログインだけ』にしてくれ。そのうえで1件ずつ判定する： LastLogon が空（$null）のアカウントは『名前： 未ログイン』、そうでなくて180日以上ログインしていないアカウントは『名前： 180日以上ログインなし』と出してくれ。未ログインを『古いログイン』と一緒にしてはいけない（テーマ5で学んだ区別だ）」',
    solution:'Get-LocalUser | Select-Object Name, LastLogon | ForEach-Object { if ($null -eq $_.LastLogon) { "$($_.Name)： 未ログイン" } else { if ($_.LastLogon -le (Get-Date).AddDays(-180)) { "$($_.Name)： 180日以上ログインなし" } } }', judge:'output',
    clearMemo:'実務メモ： Select-Object に項目名を並べると「見る項目」を選べます（* は全部）。絞り込み自体は Where-Object や if で直接やるのが実務の形で、Select-Object * を間に挟む必要はありません。そして大事な区別： 一度もログインしていないアカウントの LastLogon は空（$null）です。比較では一番古いものとして扱われてしまうので、そのまま絞ると「180日以上ログインしていない」に混ざります。if で先に $null を分けるのが、テーマ5で学んだ扱いです。',
    chips:['Get-LocalUser','|','Select-Object','Name, LastLogon','ForEach-Object','{','}','if ($null -eq $_.LastLogon)','"$($_.Name)： 未ログイン"','else','$_.LastLogon -le (Get-Date).AddDays(-180)','"$($_.Name)： 180日以上ログインなし"'] },  { id:'res-4', theme:'research', stage:4, title:'調べた項目を使う関数にする',
    request:'「段階3で見つけた項目を、引数で指定して記録する関数を作ってくれ。名前は Save-UserProperty、引数 $Property で項目名を受け取る動きで。全ユーザーの『名前 項目の値』を user-props.log に記録すること。項目の値を取り出すときは $_.項目名 と書くが、項目名が変数に入っているときは $_.$Property の形で取り出せる。作ったら LastLogon で実行してくれ」',
    solution:"function Save-UserProperty($Property) {\n  Get-LocalUser | ForEach-Object { Add-Content user-props.log \"$($_.Name) $($_.$Property)\" }\n}\nSave-UserProperty LastLogon",
    judge:'state', requireFunction:'Save-UserProperty', hiddenTest:{ calls:['Save-UserProperty -Property Enabled'], param:'$Property' },
    clearMemo:'実務メモ： $_.$Property のように、変数に入った名前でプロパティを取り出す書き方は実物でも使えます。「Get-Member で項目を見つける→その項目を引数で切り替えて使う」ができると、調べる作業がそのまま道具になります。ついでにコマンド探し： Get-Command は使えるコマンドを探すコマンドで、実物では数百件出ます。名前の一部から探す Get-Command *event* や、名詞で探す Get-Command -Noun *Service* の形が実務では便利です。',
    chips:['function','Save-UserProperty','($Property)','{','}','Get-LocalUser','|','ForEach-Object','Add-Content','user-props.log','"$($_.Name) $($_.$Property)"','LastLogon'] },  { id:'res-5', theme:'research', stage:5, title:'毎月のユーザー記録を自動化する',
    request:'「段階4で作った関数 Save-UserProperty を、毎月の自動実行に登録しよう。ゲーム内コマンド Register-AutoRun に、実行したいコマンドを { } で囲んで渡してくれ。項目は LastLogon で。user-props.log は空の状態から始まる。登録したら『1か月進める』で次の月へ進め、1か月後の最終ログインが記録されるか確かめよう」',
    solution:'Register-AutoRun { Save-UserProperty -Property LastLogon }', judge:'state',
    preload:"function Save-UserProperty($Property) { Get-LocalUser | ForEach-Object { Add-Content user-props.log \"$($_.Name) $($_.$Property)\" } }",
    sim:{ label:'1か月進める（自動実行）', pastText:'1か月が経ちました', destName:'user-props', ageUsers:30, failHint:'記録された内容が期待と違います。1か月経った最終ログインの日付が入っているはずです' },
    clearMemo:'実務メモ： Register-AutoRun はゲーム内専用コマンドです。実務ではタスクスケジューラに Register-ScheduledTask で登録します。「調べる→見つけた項目を使う→自動で記録する」がつながりました。項目の値を定期的に記録しておくと、変化に気づけます。',
    chips:['Register-AutoRun','{','Save-UserProperty -Property LastLogon','}'] },  { id:'data-1', theme:'data', stage:1, title:'棚卸し結果をCSVで渡す',
    request:'「棚卸しの結果を、表計算で開ける形で渡したい。レジストリのアンインストール情報を Get-ItemProperty で取って（長いパスはチップにある）、まず Select-Object で書き出す列を DisplayName、DisplayVersion、Publisher、InstallDate の4つに決めてから、Export-Csv で apps.csv に書き出してくれ。オプションは -NoTypeInformation と -Encoding utf8 を付けること」',
    solution:'Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Export-Csv apps.csv -NoTypeInformation -Encoding utf8', judge:'state',
    clearMemo:'実務メモ： CSV 出力の一番大事な作法は「書き出す前に Select-Object で列を決める」ことです。Get-ItemProperty の結果には、レジストリの全項目や PSPath などの管理用プロパティが付いているので、そのまま書き出すと列の顔ぶれがソフトごとにばらばらになります。-NoTypeInformation は先頭の #TYPE 行を付けない指定です。文字コードの罠： Windows PowerShell 5.1 の Export-Csv の既定は ASCII で、日本語は「?」に置き換わって失われます（文字化けではなく、データの消失です）。5.1 の -Encoding utf8 は BOM 付きです。PowerShell 7 の既定は UTF-8（BOM なし）で、日本語版 Excel でそのまま開くと文字化けするので、Excel で開く CSV は -Encoding utf8BOM にします。ほか、-NoClobber（上書きしない）、-Append（追記。列が一致しないとエラー）という指定もあります。なお Export-Csv は既存ファイルを黙って上書きするのが実物の挙動です。',
    chips:['Get-ItemProperty','HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*','|','Select-Object','DisplayName, DisplayVersion, Publisher, InstallDate','Export-Csv','apps.csv','-NoTypeInformation','-Encoding','utf8'] },  { id:'data-2', theme:'data', stage:2, title:'JSONで渡す',
    request:'「今度は、プログラム同士で受け渡せる形にしたい。Adobe のソフトだけを絞って、Select-Object で項目を4つ（DisplayName、DisplayVersion、Publisher、InstallDate）に決めてから、ConvertTo-Json で JSON にして見せてくれ」',
    solution:"Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* | Where-Object { $_.Publisher -like 'Adobe*' } | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | ConvertTo-Json", judge:'output',
    clearMemo:'実務メモ： ConvertTo-Json はオブジェクトを JSON 文字列にします。API やほかのツールへ渡すときの標準的な形です。CSV と同じく、変換の前に Select-Object で項目を決めるのが作法です（管理用プロパティまで JSON になると巨大な出力になります）。実物の表示は字下げされた複数行で、1行にしたいときは -Compress を付けます。罠： 対象が1件だけだと、配列ではなく単独のオブジェクト（{...}）になります。受け取る側が配列を期待していると壊れるので、PowerShell 7 では -AsArray で防げます。',
    chips:['Get-ItemProperty','HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*','|','Where-Object','{','}',"$_.Publisher -like 'Adobe*'",'Select-Object','DisplayName, DisplayVersion, Publisher, InstallDate','ConvertTo-Json'] },  { id:'data-3', theme:'data', stage:3, title:'CSVを読み戻して古いソフトを記録する',
    request:'「渡した CSV（apps.csv）を読み戻して、古いソフトを確認リストにしてくれ。Import-Csv で読み、InstallDate が境界（730日前）以前のソフトを『表示名 (提供元)』の形で app-list.log に記録してくれ。書式演算子 -f を使うと、\'{0} ({1})\' の形で組み立てられる。注意： CSV を経由すると値は全部文字列になり、InstallDate が無かったソフトは $null ではなく空の文字列 \'\' になる。$_.InstallDate -ne \'\' で空を除いてから比べてくれ」',
    solution:"Import-Csv apps.csv | Where-Object { $_.InstallDate -ne '' -and $_.InstallDate -le (Get-Date).AddDays(-730).ToString('yyyyMMdd') } | ForEach-Object { \"{0} ({1})\" -f $_.DisplayName, $_.Publisher } | Add-Content app-list.log", judge:'state',
    clearMemo:'実務メモ： Import-Csv で読み戻した値は、すべて文字列になります。数値の比較では \'9\' -gt \'10\' が真になるような事故も起きます。このデータに固有の罠は空の値です： レジストリでは InstallDate が無い Zoom は $null でしたが、CSV を経由すると空の文字列 \'\' になります。テーマ5・8で学んだ $null の判定は \'\' には効かず、しかも \'\' -le \'20241127\' は真なので、そのまま比べると Zoom が「古いソフト」に入ってしまいます。もう1つ、初学者が必ず踏む罠： -f で作った文字列を Export-Csv に流すと、文字列の Length（文字数）だけが列として書かれます。列を作りたいときは計算プロパティ @{Name=\'Days\'; Expression={...}} の形が要ります（-f は文字列を作る道具で、列は作れません）。',
    chips:['Import-Csv','apps.csv','|','Where-Object','{','}',"$_.InstallDate -ne ''",'$_.InstallDate -le (Get-Date).AddDays(-730).ToString(\'yyyyMMdd\')','ForEach-Object','"{0} ({1})" -f $_.DisplayName, $_.Publisher','Add-Content','app-list.log'] },  { id:'data-4', theme:'data', stage:4, title:'CSV書き出しを関数にする',
    request:'「長く入ったままのソフトを CSV で書き出す処理を、使い回せる関数にしてくれ。名前は Export-StaleApp、引数 $Days で境界の日数を受け取る動きで。InstallDate があって、境界以前のソフトを、Select-Object で列を4つに決めてから old-apps.csv に書き出す形で（-NoTypeInformation と -Encoding utf8 も付ける）。作ったら 730 で実行してくれ」',
    solution:"function Export-StaleApp($Days) {\n  $limit = (Get-Date).AddDays(-$Days).ToString('yyyyMMdd')\n  Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* | Where-Object { $_.InstallDate -and $_.InstallDate -le $limit } | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Export-Csv old-apps.csv -NoTypeInformation -Encoding utf8\n}\nExport-StaleApp 730",
    judge:'state', requireFunction:'Export-StaleApp', hiddenTest:{ calls:['Export-StaleApp -Days 1000'], param:'$Days' },
    clearMemo:'実務メモ： 「画面で見る」から「ファイルで渡す」へ。関数が CSV を返す形になると、受け取る側は表計算でもプログラムでも好きに処理できます。書き出す前の Select-Object で列を決める作法は、関数の中でも同じです。',
    chips:['function','Export-StaleApp','($Days)','{','}',"$limit = (Get-Date).AddDays(-$Days).ToString('yyyyMMdd')",'Get-ItemProperty','HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\*','|','Where-Object','$_.InstallDate -and $_.InstallDate -le $limit','Select-Object','DisplayName, DisplayVersion, Publisher, InstallDate','Export-Csv','old-apps.csv','-NoTypeInformation','-Encoding','utf8','730'] },  { id:'data-5', theme:'data', stage:5, title:'月次のCSV棚卸しを自動化する',
    request:'「段階4で作った関数 Export-StaleApp を、毎月の自動実行に登録しよう。ゲーム内コマンド Register-AutoRun に、実行したいコマンドを { } で囲んで渡してくれ。境界は 730日 で。登録したら『1か月進める』で次の棚卸しへ進め、古くなったソフトが CSV に書き出されるか確かめよう」',
    solution:'Register-AutoRun { Export-StaleApp -Days 730 }', judge:'state',
    preload:"function Export-StaleApp($Days) { $limit = (Get-Date).AddDays(-$Days).ToString('yyyyMMdd'); Get-ItemProperty HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\* | Where-Object { $_.InstallDate -and $_.InstallDate -le $limit } | Select-Object DisplayName, DisplayVersion, Publisher, InstallDate | Export-Csv old-apps.csv -NoTypeInformation -Encoding utf8 }",
    sim:{ label:'1か月進める（自動実行）', pastText:'1か月が経ちました', destName:'old-apps', home:'Packages', failHint:'書き出されたソフトが期待と違います。1か月経つと境界を越えるソフトがあります', agePackages:30, arrivals:[
      {DisplayName:'Chatwork', DisplayVersion:'2.5', Publisher:'Chatwork株式会社', InstallDays:5}
    ]},
    clearMemo:'実務メモ： Register-AutoRun はゲーム内専用コマンドです。実務ではタスクスケジューラに Register-ScheduledTask で登録します。Export-Csv は上書きなので、段階5でも過去分が積み上がる問題は起きません。構造化された出力（CSV／JSON）で残しておくと、あとから集計や比較ができます。テキストのレポートは「読むため」、CSV は「処理するため」の形です。',
    chips:['Register-AutoRun','{','Export-StaleApp -Days 730','}'] },  { id:'script-1', theme:'script', stage:1, title:'実行ポリシーを確認する',
    request:'「このPCでスクリプトが実行できるか、まず実行ポリシーを確認してくれ。Get-ExecutionPolicy というコマンドを使う」',
    solution:'Get-ExecutionPolicy', judge:'output',
    clearMemo:'実務メモ： 実行ポリシーは、.ps1 スクリプトの実行を許可するかどうかの設定です。既定は Restricted（スクリプト実行不可）になっていることが多く、「スクリプトが動かない」トラブルの定番の原因です。',
    chips:['Get-ExecutionPolicy'] },
  { id:'script-2', theme:'script', stage:2, title:'スクリプトファイルに書く',
    request:'「エラー以上（重大とエラー。Level が 1 か 2）のイベントを見るコマンドを、スクリプトファイル daily-check.ps1 に保存してくれ。Set-Content で、ファイルにコマンドの文字列を書く形で頼む」',
    solution:"Set-Content daily-check.ps1 'Get-WinEvent -LogName System | Where-Object { $_.Level -eq 1 -or $_.Level -eq 2 }'", judge:'state',
    clearMemo:'実務メモ： スクリプトファイル（.ps1）に書いて保存するのが、実務の「届け方」です。コマンドをその場で打つだけでは、次に同じ作業をするときにまた打ち直しになります。単一引用符で囲んだので、中の $_ は展開されずそのまま書かれます（二重引用符だと $_ が空に展開されて、壊れたスクリプトになります）。複数行のスクリプトを書くときは、ヒア文字列（@\' で始めて \'@ で閉じる）が実物の書き方です。文字コードの注意： スクリプトに日本語を含むとき、Windows PowerShell 5.1 は BOM のない UTF-8 のスクリプトを正しく読めません。5.1 向けに日本語を含むスクリプトは「BOM 付き UTF-8」で保存します。',
    chips:['Set-Content','daily-check.ps1',"'Get-WinEvent -LogName System | Where-Object { $_.Level -eq 1 -or $_.Level -eq 2 }'"] },  { id:'script-3', theme:'script', stage:3, title:'ポリシーを変えて実行する',
    request:'「先輩が置いたスクリプト check-disk.ps1（空きの少ないドライブ名を report.log に書く）を実行してくれ。このままだと実行ポリシーで止まるはずだ。Set-ExecutionPolicy で RemoteSigned に変更してから実行してくれ。なお、現在のフォルダーのスクリプトは名前だけでは実行できない。.\\check-disk.ps1 のように .\\ を付けて実行すること（セキュリティのための仕様で、初学者が最初に必ずつまずく点だ）」',
    solution:'Set-ExecutionPolicy RemoteSigned\n.\\check-disk.ps1', judge:'state',
    clearMemo:'実務メモ： 現在のフォルダーのスクリプトを名前だけで実行できないのは、勝手に置かれたスクリプトが意図せず実行されるのを防ぐ仕様です。.\\ を付けて「このフォルダーのもの」と明示します。RemoteSigned は「このPCで作ったスクリプトは実行可、ネットから来たものは署名が必要」という設定です。「ネットから来た」かどうかは、ファイルに付く印（Mark of the Web）で判定され、印を外すコマンドは Unblock-File です（印は経路によっては付かないこともあります）。Set-ExecutionPolicy の既定のスコープは LocalMachine で、管理者権限が必要です。権限なしで済む -Scope CurrentUser が現場ではよく使われます。変更時には確認が表示され（-Force で省略）、自動実行の中に入れると確認待ちで止まります。グループポリシーで設定されていると、変えても効きません。そして実行ポリシーは「うっかり実行を防ぐ安全装置」であって、悪意のある実行を防ぐセキュリティの壁ではありません。',
    chips:['Set-ExecutionPolicy','RemoteSigned','.\\check-disk.ps1'] },  { id:'script-4', theme:'script', stage:4, title:'引数を取るスクリプトにする',
    request:'「スクリプト自体も、関数のように引数を取れる。先輩の check-disk.ps1 を改良して、境界を引数で受け取るスクリプト weekly-check.ps1 を作ってくれ。作り方： まず実行ポリシーを RemoteSigned に変える。次に Set-Content で weekly-check.ps1 の1行目に \'param($Limit)\' を書き、Add-Content で2行目に本体（空きが $Limit より少ないドライブの名前を report.log に書くコマンド）を足す。作ったら .\\weekly-check.ps1 -Limit 20GB で実行して確かめてくれ」',
    solution:"Set-ExecutionPolicy RemoteSigned\nSet-Content weekly-check.ps1 'param($Limit)'\nAdd-Content weekly-check.ps1 'Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -lt $Limit } | ForEach-Object { $_.Name } | Add-Content report.log'\n.\\weekly-check.ps1 -Limit 20GB",
    judge:'state', hiddenMode:'runSource', hiddenReset(env){ env.Report = []; }, hiddenTest:{ calls:['.\\weekly-check.ps1 -Limit 10GB'], param:'$Limit' },
    clearMemo:'実務メモ： スクリプトの先頭に param(...) を書くと、スクリプト自体が引数を受け取れます。「関数で包む」のではなく「届けたスクリプトが引数を取る」のが、実務での配り方です。境界のような値はスクリプトの中に固定せず、呼ぶ側から渡すと、同じスクリプトを別の条件で使い回せます。',
    chips:['Set-ExecutionPolicy','RemoteSigned','Set-Content','weekly-check.ps1',"'param($Limit)'",'Add-Content',"'Get-PSDrive -PSProvider FileSystem | Where-Object { $_.Free -lt $Limit } | ForEach-Object { $_.Name } | Add-Content report.log'",'.\\weekly-check.ps1','-Limit','20GB'] },  { id:'script-5', theme:'script', stage:5, title:'タスクスケジューラの形を知る',
    request:'「check-disk.ps1 を定期実行に登録しよう。まず実行ポリシーを RemoteSigned にしてから、ゲーム内コマンド Register-AutoRun に .\\check-disk.ps1 を { } で囲んで登録してくれ。登録したら『1か月進める』で次の月へ進め、自動でチェックが走るか確かめよう」',
    solution:'Set-ExecutionPolicy RemoteSigned\nRegister-AutoRun { .\\check-disk.ps1 }', judge:'state',
    sim:{ label:'1か月進める（自動実行）', pastText:'1か月が経ちました', destName:'Report', failHint:'report.log の中身が期待と違います。1か月で空きが減ったドライブも対象に入ります', diskDeltas:[
      {Name:'G', dFreeGB:-6}
    ]},
    clearMemo:'実務メモ： ゲーム内の Register-AutoRun と実物の間にある溝は「スクリプトファイル」です。実務の最小形はこうです。$a = New-ScheduledTaskAction -Execute \'powershell.exe\' -Argument \'-NoProfile -ExecutionPolicy Bypass -File C:\\Scripts\\check-disk.ps1\'、$t = New-ScheduledTaskTrigger -Daily -At 7am、Register-ScheduledTask -TaskName \'CheckDisk\' -Action $a -Trigger $t。ここで -ExecutionPolicy Bypass は「その実行だけ」の設定で、PC 全体の設定は変えていません（全体の設定を Bypass にするのとは別物です）。罠： タスクの作業フォルダーは既定で C:\\Windows\\System32 になります。スクリプトの中の report.log のような相対パスは、手で実行したときと別の場所を指すので、$PSScriptRoot（スクリプトのある場所）を使うか、フルパスで書きます。登録されるのはコマンドではなく .ps1 ファイルです。だからこそ、スクリプトとして保存し、実行ポリシーを通しておくことが前提になります。実行ポリシーの一覧は Get-ExecutionPolicy -List でスコープごとに確認できます。',
    chips:['Set-ExecutionPolicy','RemoteSigned','Register-AutoRun','{','.\\check-disk.ps1','}'] },  { id:'remote-1', theme:'remote', stage:1, title:'リモートでプロセスを見る',
    request:'「db-server の中身を調べたい。Invoke-Command で db-server に接続し、スクリプトブロック { } の中で Get-Process を実行して、向こうのプロセスを見せてくれ」',
    solution:'Invoke-Command -ComputerName db-server -ScriptBlock { Get-Process }', judge:'output',
    clearMemo:'実務メモ： Invoke-Command は、リモートのコンピューターでコマンドを実行し、結果を手元に返します。結果には接続先を示す PSComputerName が付きます。返ってくるのは「複製」です： 型名が Deserialized.… になり、メソッドは付いてきません。テーマ13の Get-Member で TypeName を見ると、複製だと目で確かめられます。リモート実行には WinRM の有効化と権限が必要です。',
    chips:['Invoke-Command','-ComputerName','db-server','-ScriptBlock','{','Get-Process','}'] },  { id:'remote-2', theme:'remote', stage:2, title:'CIMでサービスを調べる',

  if (theme === 'events') return toEvent(raw);
  if (theme === 'report') return toEvent(raw);
  if (theme === 'errors') return toEvent(raw);
  if (theme === 'data') return toPackage(raw);
  return toFile(raw);
}
function simulate(quest, env, ctx){
  if (quest.sim.rounds){
    for (const r of quest.sim.rounds) applySimRound(quest, Object.assign({}, quest.sim, r), env, ctx);
    return;
  }
  applySimRound(quest, quest.sim, env, ctx);
}
function applySimRound(quest, sim, env, ctx){
  if (sim.ageFiles) for (const k of Object.keys(env)) for (const file of env[k]) if (file && typeof file === 'object' && file.LastWriteTime && '__date' in file.LastWriteTime) file.LastWriteTime.__date -= sim.ageFiles;
  if (sim.ageEvents) for (const e of env.Events || []) if (e.TimeCreated) e.TimeCreated.__date -= sim.ageEvents;
  const home = sim.home || 'Downloads';
  for (const a of sim.arrivals || []){
    const item = themeToItem(quest.theme, a);
    const ix = (item && typeof item === 'object' && 'Name' in item) ? env[home].findIndex(x => x && typeof x === 'object' && x.Name === item.Name) : -1;
    if (ix >= 0) env[home][ix] = item; else env[home].push(item);
  }
  for (const d of sim.diskDeltas || []){
    const drv = (env.Drives || []).find(x => x.Name === d.Name);
    if (drv){ drv.Free += d.dFreeGB * GB; drv.Used -= d.dFreeGB * GB; }
  }
  if (sim.ageUsers) for (const u of env.Users || []) if (u.LastLogon && u.LastLogon.__date <= -15) u.LastLogon.__date -= sim.ageUsers;
  for (const d of sim.hostDeltas || []){ const h = (env.Hosts || []).find(x => x.Name === d.Name); if (h) for (const k of Object.keys(d)) if (k !== 'Name') h[k] = d[k]; }
  for (const nh of sim.newHosts || []) (env.Hosts || []).push({ ...nh, Ports: { ...(nh.Ports || {}) } });
  if (sim.agePackages) for (const p of env.Packages || []) if (p.InstallDays != null){ p.InstallDays += sim.agePackages; p.InstallDate = fmtYMD(-p.InstallDays); }
  for (const nc of sim.newCommands || []) if (env.Commands) env.Commands.push(nc);
  for (const rd of sim.remoteDeltas || []){
    const h = (env.RemoteHosts || []).find(x => x.Name === rd.Host);
    if (h){ const sv = h.Services.find(x => x.Name === rd.Service); if (sv) sv.Status = rd.Status; }
  }
  if (ctx.autoRun && ctx.autoRun.block) runStatements(new Cur(ctx.autoRun.block), env, ctx, null);
  else if (ctx.autoRun) invokeFunction(ctx, env, ctx.autoRun.func, ctx.autoRun.args || [], ctx.autoRun.named);
}
function sigOf(it, withDate){
  if (it && typeof it === 'object'){
    if ('Caption' in it) return it.Caption + ':' + (it.PSComputerName || '');
    if ('TcpTestSucceeded' in it) return itemName(it) + ':' + it.RemotePort + ':' + it.TcpTestSucceeded;
    if ('Level' in it && 'Id' in it) return it.Level + ':' + it.Id + ':' + (it.TimeCreated ? it.TimeCreated.__date : '');
    if ('Status' in it) return itemName(it) + ':' + it.Status;
    if ('Enabled' in it) return itemName(it) + ':' + it.Enabled;
    if ('Length' in it) return itemName(it) + ':' + it.Length + (withDate && it.LastWriteTime ? ':' + it.LastWriteTime.__date : '');
    return itemName(it);
  }
  return String(it);
}
function stateSnapshot(env){
  const o = {};
  for (const f of Object.keys(env)) o[f] = env[f].map(x => sigOf(x, true)).slice().sort();
  return o;
}
function outputSignature(output){
  return (output || []).map(it => {
    if (it && typeof it === 'object' && '_count' in it) return 'Count=' + it._count;
    return sigOf(it);
  });
}
function loadDefs(src, env, ctx){
  const cur = new Cur(tokenize(src));
  while (!cur.done()){
    const tk = cur.peek();
    if (tk.t === 'sep'){ cur.next(); continue; }
    if (tk.t === 'word' && tk.v.toLowerCase() === 'function'){ parseFunctionDef(cur, ctx); continue; }
    let depth = 0;
    while (!cur.done()){
      const t2 = cur.peek();
      if (t2.t === '{') depth++;
      if (t2.t === '}') depth--;
      if (depth === 0 && t2.t === 'sep') break;
      cur.next();
    }
  }
}
function attempt(quest, src, preloadSrc){
  const env = themeMakeEnv(quest.theme); const ctx = newCtx();
  let err = null;
  try {
    if (preloadSrc) loadDefs(preloadSrc, env, ctx);
    runProgram(src, env, ctx);
    if (quest.sim) simulate(quest, env, ctx);
  } catch (e) { err = e.message; }
  return { env, ctx, err };
}
function judge(quest, playerSrc, playerPreloadSrc){
  const exp = attempt(quest, quest.solution, quest.preload || null);
  const got = attempt(quest, playerSrc, playerPreloadSrc !== undefined ? playerPreloadSrc : (quest.preload || null));
  const result = { pass:false, err:got.err, funcOk:true, outputOk:true, stateOk:true, code:null, diff:null, removed:[] };
  if (got.err){ result.code = 'error'; return result; }
  const fnKey = quest.requireFunction && Object.keys(got.ctx.functions).find(k => k.toLowerCase() === quest.requireFunction.toLowerCase());
  if (quest.requireFunction && !fnKey) result.funcOk = false;
  if (quest.judge === 'output'){
    result.outputOk = JSON.stringify(outputSignature((exp.ctx.output || []).concat(exp.ctx.hostOutput || []))) === JSON.stringify(outputSignature((got.ctx.output || []).concat(got.ctx.hostOutput || [])));
  }
  result.shownErrOk = JSON.stringify((exp.ctx.shownErrors || []).map(e => e.message)) === JSON.stringify((got.ctx.shownErrors || []).map(e => e.message));
  if (!result.shownErrOk) result.outputOk = false;
  if (quest.judge === 'state'){
    result.stateOk = JSON.stringify(stateSnapshot(exp.env)) === JSON.stringify(stateSnapshot(got.env));
    const es = stateSnapshot(exp.env), gs = stateSnapshot(got.env);
    if (quest.theme === 'files'){
      const remaining = [], extra = [];
      for (const f of ['Archive', 'Trash']){
        for (const n of es[f]) if (!gs[f].includes(n) && gs.Downloads.includes(n)) remaining.push(n);
        for (const n of gs[f]) if (!es[f].includes(n)) extra.push(n);
      }
      result.diff = { remaining, extra };
    }
    const keys = Object.keys(es);
    const allGot = keys.flatMap(f => gs[f]);
    const allExp = keys.flatMap(f => es[f]);
    result.removed = allExp.filter(n => !allGot.includes(n));
  }
  result.pass = result.funcOk && result.outputOk && result.stateOk;
  if (result.pass && quest.hiddenTest){
    const h = runHiddenTest(quest, playerSrc);
    if (!h.pass){ result.pass = false; result.code = h.code; }
  }
  if (result.pass && quest.failCase){
    const mkEnv = () => { const e = themeMakeEnv(quest.theme); if (quest.failCase === 'noData') delete e.Data; return e; };
    const e1 = mkEnv(), c1 = newCtx();
    try { if (quest.preload) loadDefs(quest.preload, e1, c1); runProgram(quest.solution, e1, c1); } catch (e) {}
    const e2 = mkEnv(), c2 = newCtx();
    try { const pl = playerPreloadSrc !== undefined ? playerPreloadSrc : (quest.preload || null); if (pl) loadDefs(pl, e2, c2); runProgram(playerSrc, e2, c2); } catch (e) {}
    const okF = JSON.stringify(stateSnapshot(e1)) === JSON.stringify(stateSnapshot(e2))
      && JSON.stringify((c1.shownErrors || []).map(x => x.message)) === JSON.stringify((c2.shownErrors || []).map(x => x.message));
    if (!okF){ result.pass = false; result.code = 'failcase'; }
  }
  if (!result.pass && !result.code){
    if (!result.funcOk) result.code = 'func';
    else if (result.removed && result.removed.length) result.code = 'removed';
    else if (!result.outputOk) result.code = 'output';
    else result.code = 'state';
  }
  if (result.pass) result.code = 'ok';
  return result;
}
/* Re-run the player's function with a different -Days on a fresh env.
   Catches functions that ignore $Days or cannot be called with -Days,
   which would otherwise only fail one stage later. */
function runHiddenTest(quest, playerSrc){
  for (const call of quest.hiddenTest.calls){
    const expEnv = themeMakeEnv(quest.theme); const expCtx = newCtx();
    try {
      if (quest.hiddenMode === 'runSource'){ runProgram(quest.solution, expEnv, expCtx); if (quest.hiddenReset) quest.hiddenReset(expEnv); }
      else loadDefs(quest.solution, expEnv, expCtx);
      runProgram(call, expEnv, expCtx);
    }
    catch (e) { continue; }
    const gotEnv = themeMakeEnv(quest.theme); const gotCtx = newCtx();
    try {
      if (quest.hiddenMode === 'runSource'){ runProgram(playerSrc, gotEnv, gotCtx); if (quest.hiddenReset) quest.hiddenReset(gotEnv); }
      else loadDefs(playerSrc, gotEnv, gotCtx);
      runProgram(call, gotEnv, gotCtx);
    }
    catch (e) { return { pass:false, code:'hidden-named' }; }
    const ok = JSON.stringify(stateSnapshot(expEnv)) === JSON.stringify(stateSnapshot(gotEnv))
      && JSON.stringify((expCtx.shownErrors || []).map(x => x.message)) === JSON.stringify((gotCtx.shownErrors || []).map(x => x.message));
    if (!ok) return { pass:false, code:'hidden-fixed' };
  }
  return { pass:true };
}

function tone(freq, dur, delay, type, vol, sub){
  const ctx = ac(); if (!ctx) return;
  const t0 = ctx.currentTime + (delay || 0);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1400; lp.connect(ctx.destination);
  for (const det of [1, 1.006]){
    const o = ctx.createOscillator(); o.type = type || 'triangle'; o.frequency.value = freq * det;

    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(lp); o.start(t0); o.stop(t0 + dur + 0.05);

  $('btn-next').classList.add('hidden');
  $('btn-fix4').classList.add('hidden');
  $('btn-advance').classList.add('hidden');
  show('screen-game');
}
function insertAtCursor(text){
  const el = $('cmd-input');
  const s = el.selectionStart || el.value.length, e = el.selectionEnd || el.value.length;
  const before = el.value.slice(0, s), after = el.value.slice(e);
  const padL = (before && !/[\s{(|]$/.test(before)) ? ' ' : '';
  const padR = (after && !/^[\s})|]/.test(after)) ? ' ' : '';
  el.value = before + padL + text + padR + after;
  const pos = (before + padL + text + padR).length;
  el.focus(); el.setSelectionRange(pos, pos);
}
/* ---- in-app keyboard (user decision 2026-11-26: no OS keyboard) ---- */
const KBD = {
  abc: [
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    [{t:'⇧', act:'shift', cls:'wide'}, 'z','x','c','v','b','n','m', {t:'⌫', act:'bs', cls:'wide'}],
    [{t:'#+=' , act:'page', cls:'wide'}, '-', {t:'', act:'space', cls:'space'}, {t:'改行', act:'enter', cls:'wide'}]
  ],
  sym: [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['|','$','_','{','}','(',')','-','=','*','@'],
    ["'",'"','.',',',':','/','%','\\','[',']','?',';'],
    [{t:'ABC', act:'page', cls:'wide'}, {t:'$_', ins:'$_'}, {t:'', act:'space', cls:'space'}, {t:'⌫', act:'bs'}, {t:'改行', act:'enter', cls:'wide'}]
  ]
};
let kbdPage = 'abc', kbdShift = false;
function renderKbd(){
  const box = $('kbd'); box.innerHTML = '';
  for (const row of KBD[kbdPage]){
    const r = document.createElement('div'); r.className = 'krow';
    for (const k of row){
      const key = typeof k === 'string' ? {t:k} : k;
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'key' + (key.cls ? ' ' + key.cls : '');
      b.textContent = key.act === 'space' ? 'スペース' : (key.act === 'shift' && kbdShift ? '⇧ ON' : key.t);
      if (key.act === 'shift' && kbdShift) b.classList.add('on');
      b.dataset.act = key.act || ''; b.dataset.ins = key.ins || key.t;
      r.appendChild(b);
    }
    box.appendChild(r);
  }
}
function kbdRawInsert(text){
  const el = $('cmd-input');
  const s = el.selectionStart == null ? el.value.length : el.selectionStart;
  const e = el.selectionEnd == null ? s : el.selectionEnd;
  el.value = el.value.slice(0, s) + text + el.value.slice(e);
  el.focus(); el.setSelectionRange(s + text.length, s + text.length);
}
function kbdBackspace(){
  const el = $('cmd-input');
  const s = el.selectionStart == null ? el.value.length : el.selectionStart;
  const e = el.selectionEnd == null ? s : el.selectionEnd;
  if (e > s){ el.value = el.value.slice(0, s) + el.value.slice(e); el.focus(); el.setSelectionRange(s, s); }
  else if (s > 0){ el.value = el.value.slice(0, s - 1) + el.value.slice(s); el.focus(); el.setSelectionRange(s - 1, s - 1); }
}
$('kbd').addEventListener('pointerdown', e => {
  const b = e.target.closest('.key'); if (!b) return;
  e.preventDefault();
  seTap();
  const act = b.dataset.act;
  if (act === 'shift'){ kbdShift = !kbdShift; renderKbd(); return; }
  if (act === 'page'){ kbdPage = kbdPage === 'abc' ? 'sym' : 'abc'; renderKbd(); return; }
  if (act === 'bs'){ kbdBackspace(); return; }
  if (act === 'enter'){ kbdRawInsert('\n'); return; }
  if (act === 'space'){ kbdRawInsert(' '); return; }
  let t = b.dataset.ins;
  if (kbdPage === 'abc' && kbdShift && /^[a-z]$/.test(t)){ t = t.toUpperCase(); kbdShift = false; renderKbd(); }
  kbdRawInsert(t);
});
renderKbd();
function formatOutput(output){
  if (!output || !output.length) return '<span class="dim">（出力なし）</span>';
  return output.map(it => {
    if (typeof it === 'boolean') return it ? 'True' : 'False';
    if (it && typeof it === 'object' && '_count' in it) return 'Count : ' + it._count;
    if (it && typeof it === 'object' && 'MemberType' in it) return `${it.Name}　${it.MemberType}`;
    if (it && typeof it === 'object' && 'CommandType' in it) return `${it.Name}　${it.CommandType}`;
    if (it && typeof it === 'object' && 'Caption' in it) return `${it.Caption}　${it.Version || ''}　(${it.PSComputerName || ''})`;
    if (it && typeof it === 'object' && 'State' in it && 'StartMode' in it) return `${it.Name}　${it.State}　(${it.PSComputerName || ''})`;
    if (it && typeof it === 'object' && 'Used' in it) return it.Free == null ? `${it.Name}　（${it.Provider || 'PSDrive'}）` : `${it.Name} ドライブ　使用 ${fmtGB(it.Used)}　空き ${fmtGB(it.Free)}`;
    if (it && typeof it === 'object' && 'WS' in it) return `${it.Name}　メモリ ${fmtMB(it.WS)}　CPU ${it.CPU}`;
    if (it && typeof it === 'object' && 'Level' in it && 'Id' in it) return `${fmtDate(it.TimeCreated)} ${it.Time}　${it.LevelDisplayName}　ID:${it.Id}　${it.Message}`;
    if (it && typeof it === 'object' && 'DisplayVersion' in it && 'Publisher' in it) return `${it.DisplayName}　${it.DisplayVersion}　${it.Publisher}`;
    if (it && typeof it === 'object' && 'TcpTestSucceeded' in it) return `${it.ComputerName}　ポート ${it.RemotePort}　${it.TcpTestSucceeded ? '接続OK' : '接続できません'}`;
    if (it && typeof it === 'object' && 'PingSucceeded' in it) return `${it.ComputerName}　ping ${it.PingSucceeded ? 'Success' : 'TimedOut'}`;
    if (it && typeof it === 'object' && 'Status' in it && 'IPAddress' in it) return `${it.Destination}　${it.Address}　${it.Status}${it.Latency != null ? '　' + it.Latency + 'ms' : ''}`;
    if (it && typeof it === 'object' && 'Status' in it) return `${it.Name}　${it.Status}`;
    if (it && typeof it === 'object' && 'Enabled' in it) return `${it.Name}　${it.Enabled ? 'True' : 'False'}　${it.Description || ''}`;
    if (it && typeof it === 'object' && 'Name' in it) return `${it.Name}　${fmtSize(it.Length)}　${fmtDate(it.LastWriteTime)}`;
    if (it && typeof it === 'object' && 'Message' in it) return `${it.Time}　${it.LevelDisplayName}　${it.ProviderName}　${it.Message}`;
    return String(it);
  }).join('\n');
}
function feedback(html, ok){
  const p = $('feedback-panel'); p.classList.remove('hidden');
  const t = $('feedback-text'); t.innerHTML = html; t.className = 'feedback ' + (ok ? 'ok' : 'ng');
}
function markCleared(q){
  const arr = clearedStages(q.theme);
  if (!arr.includes(q.stage)){ arr.push(q.stage); save.cleared[q.theme] = arr; }
  if (q.stage === 4) save.scripts[q.theme] = $('cmd-input').value;
  if (q.stage === 5) save.auto[q.theme] = true;
  persist();
}
function diffText(r){
  if (!r.diff) return '';
  let s = '';
  if (r.diff.remaining.length) s += '<br>まだ Downloads に残っている： ' + r.diff.remaining.join('、');
  if (r.diff.extra.length) s += '<br>動かなくてよいものが動いている： ' + r.diff.extra.join('、');
  return s;
}
$('btn-fix4').addEventListener('click', () => { seTap(); const q4 = QUESTS.find(x => x.theme === currentQuest.theme && x.stage === 4); if (q4) openQuest(q4); });
$('btn-reset').addEventListener('click', () => { seTap(); openQuest(currentQuest); });
$('btn-run').addEventListener('click', () => {
  const q = currentQuest; const src = $('cmd-input').value.trim();
  $('btn-next').classList.add('hidden');
  if (!src){ seNg(); feedback('コマンドが入力されていません。', false); return; }
  seRun();
  // display run
  const dispEnv = themeMakeEnv(q.theme); const dispCtx = newCtx();
  try {
    if (q.stage === 5 && save.scripts[q.theme]) loadDefs(save.scripts[q.theme], dispEnv, dispCtx);
    runProgram(src, dispEnv, dispCtx);
  } catch (e) {
    $('out-panel').classList.add('hidden');
    seNg();
    feedback('実行エラー： ' + e.message, false);
    return;
  }
  $('out-panel').classList.remove('hidden');
  $('out-text').innerHTML = formatOutput(dispCtx.output.concat(dispCtx.hostOutput || []));
  $('quest-env').innerHTML = envHtml(dispEnv);
  if (q.stage === 5){
    if (dispCtx.autoRun){
      feedback('自動実行を登録しました。『1か月進める』で翌月の様子を見てみましょう。', true);
      $('btn-advance').classList.remove('hidden');
    } else {
      feedback('まだ自動実行が登録されていません。Register-AutoRun で登録してください。', false);
    }
    return;
  }
  const preload = q.stage === 5 ? (save.scripts[q.theme] || '') : undefined;
  const r = judge(q, src, preload);
  if (r.pass){
    markCleared(q);
    seOk();
    feedback('✔ クリア！ 依頼どおりの結果になりました。' + (q.clearMemo ? '<br><span style="font-size:12.5px;color:var(--sub)">' + q.clearMemo + '</span>' : ''), true);
    const next = QUESTS.find(x => x.theme === q.theme && x.stage === q.stage + 1);
    if (next){ const b = $('btn-next'); b.classList.remove('hidden'); b.onclick = () => openQuest(next); }
  } else if (r.code === 'hidden-named'){
    seNg();
    const p = (q.hiddenTest && q.hiddenTest.param) || '引数';
    feedback('関数を ' + p + ' の名前付きで呼び出す形になっていません。引数名を ' + p + ' にしてください（param(' + p + ') の形でも構いません）。段階5でも名前付きで呼ばれるので、今のうちに直しておきましょう。', false);
  } else if (r.code === 'hidden-fixed'){
    seNg();
    const p = (q.hiddenTest && q.hiddenTest.param) || '引数';
    feedback('引数の値を変えて試しても、結果が変わりませんでした。関数の中で ' + p + ' を使って絞り込んでいますか？（値を直接書き込むと、別の値で呼ばれたときに動きません）', false);
  } else if (!r.funcOk){
    seNg();
    feedback('関数の形になっていません。function で ' + q.requireFunction + ' を定義し、呼び出すところまで書いてください。', false);
  } else if (r.code === 'removed'){
    seNg();
    feedback('ファイルが完全に消えています。Remove-Item はごみ箱に入らず完全に消えてしまうので、移動には Move-Item を使います。消えたファイル： ' + r.removed.join('、'), false);
  } else if (!r.outputOk){
    seNg();
    feedback('出力が依頼と違います。対象のファイルと並び順を確認してください。', false);
  } else {
    seNg();
    feedback('結果の状態が依頼と違います。' + diffText(r), false);
  }
});
$('btn-advance').addEventListener('click', () => {
  const q = currentQuest; const src = $('cmd-input').value.trim();
  const preload = save.scripts[q.theme] || '';
  const r = judge(q, src, preload);
  // show the simulated time skip on a display env
  const env = themeMakeEnv(q.theme); const ctx = newCtx();
  try {
    if (preload) loadDefs(preload, env, ctx);
    runProgram(src, env, ctx);
    const before = stateSnapshot(env);
    simulate(q, env, ctx);
    const after = stateSnapshot(env);
    const dest = q.sim.destName;
    const moved = (after[dest] || []).filter(n => !(before[dest] || []).includes(n));
    const verb = q.sim.verb || 'へ移動';
    let changeText;
    if (q.sim.stateKey){
      const bk = q.sim.stateKey;
      const changed = (after[bk] || []).filter(n => !(before[bk] || []).includes(n))
        .map(n => n.replace(/:(true|false)$/, (m, v) => v === 'false' ? ' を無効化' : ' を有効化'));
      changeText = changed.length ? (q.sim.stateLabel || '自動実行で変わったもの：') + '\n' + changed.join('\n') : '自動実行で変化したものはありません';
    } else if (q.sim.goneFrom){
      const gone = (before[q.sim.goneFrom] || []).filter(n => !(after[q.sim.goneFrom] || []).includes(n));
      changeText = gone.length ? (q.sim.goneLabel || '自動実行で無くなったもの：') + '\n' + gone.join('\n') : '自動実行で変化したものはありません';
    } else {
      changeText = moved.length ? '自動実行で ' + dest + ' ' + verb + '：\n' + moved.join('\n') : '自動実行で変化したものはありません';
    }
    $('out-panel').classList.remove('hidden');
    $('out-text').innerHTML = '— ' + q.sim.pastText + ' —\n' + changeText;
    $('quest-env').innerHTML = envHtml(env);
  } catch (e) { feedback('実行エラー： ' + e.message, false); return; }
  if (r.pass){
    markCleared(q);
    seOk();
    feedback('✔ クリア！ 登録したスクリプトが自動で片付けてくれました。このテーマは自動化済みです。' + (q.clearMemo ? '<br><span style="font-size:12.5px;color:var(--sub)">' + q.clearMemo + '</span>' : ''), true);
    $('btn-advance').classList.add('hidden');
  } else {
    seNg();
    let msg = '自動実行後の状態が依頼と違います。' + (q.sim.failHint || diffText(r));
    if (preload) msg += '<br><span style="font-size:12.5px;color:var(--sub)">読み込まれている段階4の関数：<br>' + preload.replace(/</g, '&lt;').replace(/\n/g, '<br>') + '</span>';
    feedback(msg, false);
    $('btn-fix4').classList.remove('hidden');
  }
});
